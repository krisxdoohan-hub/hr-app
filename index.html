<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#D35400">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="HR系統">
    <link rel="apple-touch-icon" href="apple-touch-icon.png">
    <link rel="manifest" href='data:application/manifest+json;utf-8,{"name":"HR 出勤系統","short_name":"HR系統","start_url":".","display":"standalone","background_color":"#FDF2E9","theme_color":"#D35400","icons":[{"src":"icon-192.png","sizes":"192x192","type":"image/png"},{"src":"icon-512.png","sizes":"512x512","type":"image/png"}]}'>
    <title>HR 出勤系統</title>
    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                const swCode = "self.addEventListener('install', e => e.waitUntil(self.skipWaiting())); self.addEventListener('activate', e => e.waitUntil(self.clients.claim())); self.addEventListener('fetch', e => { e.respondWith(fetch(e.request).catch(() => new Response('Offline'))); });";
                const blob = new Blob([swCode], { type: 'application/javascript' });
                navigator.serviceWorker.register(URL.createObjectURL(blob));
            });
        }
    </script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/lucide@latest"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/lz-string/1.5.0/lz-string.min.js"></script>
    <style>
        /* UI/UX Pro Max - Global Design Protocol */
        :root {
            --primary: #D35400;
            --secondary: #E67E22;
            --surface: #FDF2E9;
            --text-main: #333333;
        }
        body {
            line-height: 1.5;
            background-color: var(--surface);
            color: var(--text-main);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            overscroll-behavior-y: none;
        }
        
        .btn-primary-action {
            background-color: var(--primary);
            color: white;
            transition: all 0.2s ease-in-out;
        }
        .btn-primary-action:hover { background-color: var(--secondary); }
        .btn-primary-action:active { transform: scale(0.96); }
        .btn-primary-action:disabled { background-color: #D1D5DB; cursor: not-allowed; transform: none; }

        .btn-outline-action {
            color: var(--primary);
            border: 1px solid var(--primary);
            transition: all 0.2s;
        }
        .btn-outline-action:hover { background-color: var(--surface); }
        .btn-outline-action:active { transform: scale(0.96); }

        .input-error-state { border: 2px solid #EF4444 !important; }
        .error-hint { color: #EF4444; font-size: 0.875rem; margin-top: 4px; }

        .card-data-container {
            background-color: #FFFFFF;
            border-radius: 12px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.05);
            padding: 24px;
        }

        .sidebar-item-active { background-color: var(--primary); color: white; border-radius: 8px; }
        .sidebar-item { color: #9CA3AF; transition: all 0.2s; border-radius: 8px; }
        .sidebar-item:hover { background-color: rgba(211, 84, 0, 0.1); color: var(--primary); }

        .loader {
            border: 3px solid #f3f3f3;
            border-top: 3px solid var(--primary);
            border-radius: 50%;
            width: 16px;
            height: 16px;
            animation: spin 1s linear infinite;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        .fade-in { animation: fadeIn 0.3s ease-in; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const APP_VERSION = 'v0.0.0.0.67   ';
        const { useState, useEffect, useMemo, useRef } = React;
        const STORAGE_KEY = 'HR_APP_DATA_V10_FUSION';

        const LockScreen = ({ onUnlock, error, passcodeLength = 6 }) => {
            const [passcode, setPasscode] = useState('');
            const handleChange = (e) => setPasscode(e.target.value.replace(/[^0-9]/g, ''));
            const handleSubmit = (e) => { e.preventDefault(); onUnlock(passcode); };

            return (
                <div className="fixed inset-0 z-[200] bg-slate-900 flex flex-col items-center justify-center px-6">
                    <div className="bg-white p-8 rounded-3xl shadow-2xl w-full max-w-xs text-center relative overflow-hidden fade-in">
                        <div className="absolute top-0 left-0 w-full h-2 bg-[var(--primary)]"></div>
                        <div className="flex justify-center mb-4 text-[var(--primary)]"><i data-lucide="lock" className="w-12 h-12"></i></div>
                        <h2 className="text-xl font-black text-gray-800 mb-2">系統已鎖定</h2>
                        <p className="text-xs text-gray-500 font-bold mb-6">預設密碼為 123456</p>
                        <form onSubmit={handleSubmit}>
                            <input type="password" value={passcode} onChange={handleChange} maxLength={passcodeLength} placeholder="******"
                                className={`w-full text-center text-2xl tracking-[0.5em] font-black border-2 rounded-xl py-3 focus:outline-none transition-all ${error ? 'input-error-state bg-red-50' : 'border-gray-200 focus:border-[var(--primary)]'}`} />
                            {error && <p className="error-hint animate-pulse mt-2">{error}</p>}
                            <button type="submit" className="mt-6 w-full btn-primary-action py-3 rounded-xl font-bold flex items-center justify-center gap-2">
                                <i data-lucide="key" className="w-4 h-4"></i> 解鎖進入
                            </button>
                        </form>
                    </div>
                </div>
            );
        };

        const StatCard = ({ icon, title, value, subtext, highlight, bgColor, iconColor }) => (
            <div className="card-data-container flex items-center gap-6">
                <div className={`w-16 h-16 rounded-full flex items-center justify-center ${bgColor} ${iconColor}`}>
                    <i data-lucide={icon} className="w-8 h-8"></i>
                </div>
                <div>
                    <div className="text-gray-500 text-sm font-medium mb-1">{title}</div>
                    <div className="text-3xl font-bold text-gray-800 mb-1">{value}</div>
                    <div className="text-sm text-gray-400 flex items-center gap-1">
                        {subtext} {highlight && <span className={highlight.includes('↑') ? "text-green-500" : ""}>{highlight}</span>}
                    </div>
                </div>
            </div>
        );

        const App = () => {
            const [isLocked, setIsLocked] = useState(true);
            const [lockError, setLockError] = useState('');
            const [currentView, setCurrentView] = useState('dashboard');
            const [isLoading, setIsLoading] = useState(false);
            const [isAmountMasked, setIsAmountMasked] = useState(false);
            const [targetMonth, setTargetMonth] = useState(new Date().toISOString().slice(0, 7));
            
            const [transferModal, setTransferModal] = useState({ isOpen: false, mode: '', text: '' });
            
            const [leaveForm, setLeaveForm] = useState({ date: new Date().toISOString().split('T')[0], endDate: new Date().toISOString().split('T')[0], type: 'annual', hours: 8, startTime: '09:00', endTime: '18:00' });
            const [showBrackets, setShowBrackets] = useState(false);
            const pressTimer = useRef(null);

            const handlePressStart = () => { pressTimer.current = setTimeout(() => setShowBrackets(true), 800); };
            const handlePressEnd = () => { if (pressTimer.current) clearTimeout(pressTimer.current); setShowBrackets(false); };
            
            const [data, setData] = useState(() => {
                const saved = localStorage.getItem(STORAGE_KEY);
                return saved ? JSON.parse(saved) : {
                    passcode: '123456',
                    gasUrl: '',
                    monthlySalaries: {},
                    dependentsCount: 0,
                    employmentStartDate: '2023-08-07',
                    historicalLeave: { annual: 0, sick: 0, personal: 0, family_care: 0 },
                    records: [],
                    holidays: {},
                    workStartTime: '09:00',
                    workEndTime: '18:00',
                    fullAttendanceBonus: 1000,
                    disasterLeaveDeduct: true
                };
            })

            useEffect(() => {
                if (window.lucide) window.lucide.createIcons();
            });

            useEffect(() => {
                localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
            }, [data]);

            const syncToCloud = async (newData, showLoading = false) => {
                setData(newData); 
                if (!newData.gasUrl) return; 
                if (showLoading) setIsLoading(true);
                try {
                    await fetch(newData.gasUrl, { method: 'POST', body: JSON.stringify(newData) });
                } catch (err) { console.error('雲端儲存失敗', err); }
                if (showLoading) setIsLoading(false);
            };

            const fetchFromCloud = async () => {
                if (!data.gasUrl) return alert('請先至「員工管理」設定 GAS 雲端網址');
                setIsLoading(true);
                try {
                    const res = await fetch(data.gasUrl);
                    const cloudData = await res.json();
                    if (Object.keys(cloudData).length > 0) {
                        setData(cloudData);
                        alert('成功從雲端同步資料！');
                    }
                } catch (err) { alert('讀取失敗，請確認 GAS 網址與網路連線。'); }
            setIsLoading(false);
        };

        // 首次開啟網頁時自動從雲端同步資料 (不跳出 alert 打擾使用者)
        useEffect(() => {
            const autoFetch = async () => {
                if (data.gasUrl) {
                    setIsLoading(true);
                    try {
                        const res = await fetch(data.gasUrl);
                        const cloudData = await res.json();
                        if (Object.keys(cloudData).length > 0) {
                            setData(cloudData);
                            console.log('首次載入：自動同步雲端資料成功');
                        }
                    } catch (err) { 
                        console.error('自動同步雲端資料失敗，請確認連線。', err); 
                    }
                    setIsLoading(false);
                }
            };
            autoFetch();
        }, []);

        // 自動補卡邏輯回溯至 4月
        useEffect(() => {
            if (isLocked) return;
                
                const now = new Date();
                const year = now.getFullYear();
                const startDate = new Date(year, 3, 1); 
                let hasChanges = false;
                let newRecords = [...data.records];

                // 解析設定的標準上下班時間
                const defaultStartH = parseInt((data.workStartTime || '09:00').split(':')[0], 10);
                const defaultStartM = parseInt((data.workStartTime || '09:00').split(':')[1], 10);
                const defaultEndH = parseInt((data.workEndTime || '18:00').split(':')[0], 10);
                const defaultEndM = parseInt((data.workEndTime || '18:00').split(':')[1], 10);

                for (let d = new Date(startDate); d <= now; d.setDate(d.getDate() + 1)) {
                    const y = d.getFullYear();
                    const m = d.getMonth();
                    const day = d.getDate();
                    const dayOfWeek = d.getDay();
                    const dateStr = `${y}-${String(m + 1).padStart(2, '0')}-${String(day).padStart(2, '0')}`;
                    
                    let shouldWork = (dayOfWeek >= 1 && dayOfWeek <= 5);
                    if (data.holidays && data.holidays[dateStr] !== undefined) {
                        shouldWork = !data.holidays[dateStr]; 
                    }

                    let targetStartH = defaultStartH, targetStartM = defaultStartM;
                    let targetEndH = defaultEndH, targetEndM = defaultEndM;
                    
                    // 取得當天的所有請假紀錄
                    const todayLeaves = newRecords.filter(r => r.date === dateStr && ['annual', 'sick', 'personal', 'unpaid', 'family_care', 'disaster'].includes(r.type));
                    const todayLeaveHours = todayLeaves.reduce((sum, r) => sum + (r.hours || 0), 0);
                        
                    if (todayLeaveHours >= 8) {
                        shouldWork = false; // 滿8小時不需出勤
                    } else if (todayLeaves.length > 0) {
                        // 動態調整應打卡時間：若請假時數小於8小時
                        todayLeaves.forEach(leave => {
                            if (leave.startTime && leave.endTime) {
                                const [lStartH, lStartM] = leave.startTime.split(':').map(Number);
                                const [lEndH, lEndM] = leave.endTime.split(':').map(Number);
                                
                                // 若請假是從上班時間開始 (上午請假) -> 上班打卡時間延後至請假結束時間
                                if (lStartH === defaultStartH && lStartM === defaultStartM) {
                                    targetStartH = lEndH;
                                    targetStartM = lEndM;
                                }
                                // 若請假是直到下班時間結束 (下午請假) -> 下班打卡時間提前至請假開始時間
                                else if (lEndH === defaultEndH && lEndM === defaultEndM) {
                                    targetEndH = lStartH;
                                    targetEndM = lStartM;
                                }
                            }
                        });
                    }
                    
                    if (shouldWork) { 
                        const hasPunchIn = newRecords.some(r => r.date === dateStr && r.type === 'punch_in');
                        const hasPunchOut = newRecords.some(r => r.date === dateStr && r.type === 'punch_out');

                        // 依據推算後的目標時間 (targetStart) 決定上班打卡
                        const punchInLimitDate = new Date(y, m, day, targetStartH, targetStartM);
                        punchInLimitDate.setMinutes(punchInLimitDate.getMinutes() - 1);
                        const punchInLimit = punchInLimitDate.getTime();

                        if (!hasPunchIn && now.getTime() > punchInLimit) {
                            const randomMinOffset = 1 + Math.floor(Math.random() * 5);
                            const finalInTime = new Date(punchInLimitDate.getTime());
                            finalInTime.setMinutes(finalInTime.getMinutes() - randomMinOffset + 1);
                            const timeStr = `${String(finalInTime.getHours()).padStart(2, '0')}:${String(finalInTime.getMinutes()).padStart(2, '0')}`;
                            newRecords.push({ id: Date.now() + Math.random(), date: dateStr, type: 'punch_in', time: timeStr, hours: 0, amount: 0 });
                            hasChanges = true;
                        }

                        const otRecord = newRecords.find(r => r.date === dateStr && r.type === 'overtime');

                        if (!hasPunchOut) {
                            if (otRecord) {
                                // 加班一律從標準下班時間往後加
                                const targetTime = new Date(y, m, day, defaultEndH, defaultEndM);
                                targetTime.setMinutes(targetTime.getMinutes() + otRecord.hours * 60);
                                const otPunchOutLimit = targetTime.getTime() + (3 * 60000); 
                                
                                if (now.getTime() > otPunchOutLimit) {
                                    const randomMinOffset = 1 + Math.floor(Math.random() * 3);
                                    targetTime.setMinutes(targetTime.getMinutes() + randomMinOffset);
                                    const timeStr = `${String(targetTime.getHours()).padStart(2, '0')}:${String(targetTime.getMinutes()).padStart(2, '0')}`;
                                    newRecords.push({ id: Date.now() + Math.random(), date: dateStr, type: 'punch_out', time: timeStr, hours: 0, amount: 0 });
                                    hasChanges = true;
                                }
                            } else {
                                // 依據推算後的目標時間 (targetEnd) 決定下班打卡
                                const defaultCutoffDate = new Date(y, m, day, targetEndH, targetEndM);
                                defaultCutoffDate.setMinutes(defaultCutoffDate.getMinutes() + 5);
                                const defaultCutoffTime = defaultCutoffDate.getTime();
                                
                                if (now.getTime() > defaultCutoffTime) {
                                    const randomMinOffset = 1 + Math.floor(Math.random() * 3);
                                    const finalOutTime = new Date(y, m, day, targetEndH, targetEndM);
                                    finalOutTime.setMinutes(finalOutTime.getMinutes() + randomMinOffset);
                                    const timeStr = `${String(finalOutTime.getHours()).padStart(2, '0')}:${String(finalOutTime.getMinutes()).padStart(2, '0')}`;
                                    newRecords.push({ id: Date.now() + Math.random(), date: dateStr, type: 'punch_out', time: timeStr, hours: 0, amount: 0 });
                                    hasChanges = true;
                                }
                            }
                        }
                    }
                }

                if (hasChanges) {
                    syncToCloud({ ...data, records: newRecords }, false);
                }
            }, [isLocked, data]);
            const handleManualPunch = (type) => {
                const now = new Date();
                const date = now.toISOString().split('T')[0];
                const time = now.toTimeString().slice(0, 5);
                
                if (data.records.some(r => r.date === date && r.type === type)) {
                    alert(type === 'punch_in' ? '今日已打過上班卡！' : '今日已打過下班卡！');
                    return;
                }
                syncToCloud({ ...data, records: [{ id: Date.now(), date, type, time, hours: 0, amount: 0 }, ...data.records] }, true);
                alert(`${type === 'punch_in' ? '上班' : '下班'}打卡成功！時間：${time}`);
            };

            const handleUnlock = (input) => {
                if (input === data.passcode) { setIsLocked(false); setLockError(''); } 
                else { setLockError('密碼錯誤，請重新輸入'); }
            };

            const currentSalary = useMemo(() => {
                if (data.monthlySalaries[targetMonth]) return data.monthlySalaries[targetMonth];
                const past = Object.keys(data.monthlySalaries).filter(m => m < targetMonth).sort().reverse();
                return past.length > 0 ? data.monthlySalaries[past[0]] : 29500;
            }, [data.monthlySalaries, targetMonth]);

            const exactHourlyWage = useMemo(() => Math.round((currentSalary || 0) / 240), [currentSalary]);

            const laborBracket = useMemo(() => {
                const brackets = [29500, 30300, 31800, 33300, 34800, 36300, 38200, 40100, 42000, 43900, 45800];
                return brackets.find(x => currentSalary <= x) || brackets[brackets.length - 1] || 0;
            }, [currentSalary]);

            const laborFee = useMemo(() => {
                return Math.round(laborBracket * 0.125 * 0.2);
            }, [laborBracket]);

            const healthBracket = useMemo(() => {
                const brackets = [29500, 30300, 31800, 33300, 34800, 36300, 38200, 40100, 42000, 43900, 45800, 48200, 50600, 53000, 55400, 57800, 60800, 63800, 66800, 69800, 72800, 76500, 80200, 83900, 87600, 92100, 96600, 101100, 105600, 110100, 115500, 120900, 126300, 131700, 137100, 142500, 147900, 219500];
                return brackets.find(x => currentSalary <= x) || brackets[brackets.length - 1] || 0;
            }, [currentSalary]);

            const healthFee = useMemo(() => {
                return Math.round(healthBracket * 0.0517 * 0.3) * (1 + (data.dependentsCount || 0));
            }, [healthBracket, data.dependentsCount]);

            const annualLeaveTotalHours = useMemo(() => {
                if (!data.employmentStartDate) return 0;
                const diffYears = (new Date() - new Date(data.employmentStartDate)) / (1000 * 60 * 60 * 24 * 365.25);
                let days = 0;
                if (diffYears >= 0.5 && diffYears < 1) days = 3;
                else if (diffYears >= 1 && diffYears < 2) days = 7;
                else if (diffYears >= 2 && diffYears < 3) days = 10;
                else if (diffYears >= 3 && diffYears < 5) days = 14;
                else if (diffYears >= 5 && diffYears < 10) days = 15;
                else if (diffYears >= 10) days = Math.min(30, 15 + Math.floor(diffYears) - 9);
                return days * 8;
            }, [data.employmentStartDate]);

            const leaveUsed = useMemo(() => {
                const u = { annual: 0, sick: data.historicalLeave?.sick || 0, personal: data.historicalLeave?.personal || 0, family_care: data.historicalLeave?.family_care || 0 };
                const now = new Date();
                const start = new Date(data.employmentStartDate || now);
                let baseDate = new Date(now.getFullYear(), start.getMonth(), start.getDate());
                if (baseDate > now) baseDate.setFullYear(baseDate.getFullYear() - 1);

                data.records.forEach(r => {
                    const recDate = new Date(r.date);
                    if (r.type === 'annual') {
                        if (recDate >= baseDate) u.annual += r.hours;
                    } else if (u[r.type] !== undefined) {
                        u[r.type] += r.hours;
                    }
                });
                u.annual += data.historicalLeave?.annual || 0;
                return u;
            }, [data.records, data.historicalLeave, data.employmentStartDate]);

            const leaveLimits = { annual: annualLeaveTotalHours, sick: 240, personal: 112, family_care: 56 };
            const formatDaysHours = (h) => h % 8 === 0 ? `${h / 8}天` : `${Math.floor(h / 8)}天${h % 8}h`;

            // 動態處理天災假扣薪設定：若設定為不扣薪，則強制將所有天災假扣款歸零
            const processRecordAmount = (r) => {
                if (r.type === 'disaster' && data.disasterLeaveDeduct === false && r.amount < 0) {
                    return { ...r, amount: 0 };
                }
                return r;
            };
            const monthlyRecords = data.records.filter(r => r.date.startsWith(targetMonth)).map(processRecordAmount).sort((a,b) => new Date(b.date) - new Date(a.date));
            const targetYear = targetMonth.split('-')[0];
            const yearlyRecords = data.records.filter(r => r.date.startsWith(targetYear)).map(processRecordAmount).sort((a,b) => new Date(b.date) - new Date(a.date));
            const actualWorkDays = new Set(monthlyRecords.filter(r => r.type === 'punch_in').map(r => r.date)).size;

            const otHours = monthlyRecords.filter(r => r.type === 'overtime').reduce((sum, r) => sum + r.hours, 0);
            const monthlyOtTier1 = monthlyRecords.filter(r => r.type === 'overtime').reduce((sum, r) => sum + Math.min(r.hours, 2), 0);
            const monthlyOtTier2 = monthlyRecords.filter(r => r.type === 'overtime').reduce((sum, r) => sum + Math.max(r.hours - 2, 0), 0);
            const monthlyOtPay = Math.round(exactHourlyWage * 1.34 * monthlyOtTier1) + Math.round(exactHourlyWage * 1.67 * monthlyOtTier2);
            const leaveHours = monthlyRecords.filter(r => ['annual','sick','personal','unpaid','family_care','disaster'].includes(r.type)).reduce((sum, r) => sum + r.hours, 0);
            const totalMonthlyChanges = monthlyRecords.filter(r => r.type !== 'overtime').reduce((sum, r) => sum + r.amount, 0) + monthlyOtPay;
            
            const hasLostFullAttendance = monthlyRecords.some(r => ['sick', 'personal', 'unpaid'].includes(r.type));
            const fullAttendanceDeduction = hasLostFullAttendance ? (data.fullAttendanceBonus || 0) : 0;
            const estimatedFinalSalary = (currentSalary || 0) + totalMonthlyChanges - laborFee - healthFee - fullAttendanceDeduction;

            const allLeaves = data.records.filter(r => ['annual', 'sick', 'personal', 'unpaid', 'family_care', 'disaster'].includes(r.type)).sort((a,b) => new Date(b.date) - new Date(a.date)).slice(0, 5);
            let weekdaysInMonth = 0;
            const daysInMonth = new Date(targetYear, targetMonth.split('-')[1], 0).getDate();
            for(let i=1; i<=daysInMonth; i++) {
                const dateStr = `${targetYear}-${String(targetMonth.split('-')[1]).padStart(2, '0')}-${String(i).padStart(2, '0')}`;
                const d = new Date(targetYear, parseInt(targetMonth.split('-')[1])-1, i).getDay();
                let shouldWork = (d !== 0 && d !== 6);
                if (data.holidays && data.holidays[dateStr] !== undefined) {
                    shouldWork = !data.holidays[dateStr];
                }
                if (shouldWork) weekdaysInMonth++;
            }
            const leaveDaysThisMonth = new Set(monthlyRecords.filter(r => ['annual', 'sick', 'personal', 'unpaid', 'family_care', 'disaster'].includes(r.type)).map(r => r.date)).size;
            const otDaysThisMonth = new Set(monthlyRecords.filter(r => r.type === 'overtime').map(r => r.date)).size;
            const missedDaysThisMonth = Math.max(0, weekdaysInMonth - actualWorkDays - leaveDaysThisMonth);

            const renderDashboard = () => (
                <div className="fade-in">
                    <div className="flex justify-between items-center mb-6">
                        <h2 className="text-xl font-bold text-gray-800">首頁總覽</h2>
                        <input type="month" value={targetMonth} onChange={(e) => setTargetMonth(e.target.value)} className="px-4 py-2 border rounded-lg font-bold text-gray-700 outline-none focus:border-[var(--primary)]" />
                    </div>
                    <div className="grid grid-cols-1 md:grid-cols-3 gap-6 mb-6">
                        <StatCard icon="calendar-check" title="本月出勤天數" value={`${actualWorkDays} 天`} subtext="基於打卡紀錄" bgColor="bg-blue-50" iconColor="text-blue-500" />
                        <StatCard icon="clock" title="本月加班時數" value={otHours} highlight="小時" bgColor="bg-green-50" iconColor="text-green-500" />
                        <StatCard icon="plane" title="本月請假時數" value={leaveHours} highlight="小時" bgColor="bg-orange-50" iconColor="text-orange-500" />
                    </div>
                    <div className="grid grid-cols-1 md:grid-cols-3 gap-6 mb-6">
                        <div className="card-data-container md:col-span-2 overflow-x-auto">
                            <div className="flex justify-between items-center mb-6 min-w-min">
                                <h2 className="text-lg font-bold text-gray-800">本年度出勤與變動</h2>
                                <button onClick={() => setCurrentView('records')} className="text-[var(--primary)] text-sm flex items-center hover:underline whitespace-nowrap ml-4">查看完整紀錄 <i data-lucide="chevron-right" className="w-4 h-4"></i></button>
                            </div>
                            <table className="w-full text-center text-sm min-w-[400px]">
                                <thead>
                                    <tr className="text-gray-500 border-b border-gray-100">
                                        <th className="py-3 font-medium">日期</th>
                                        <th className="py-3 font-medium">類別</th>
                                        <th className="py-3 font-medium">時數/時間</th>
                                        <th className="py-3 font-medium">增減金額</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    {yearlyRecords.filter(r => ['annual', 'sick', 'personal', 'unpaid', 'family_care', 'disaster'].includes(r.type)).slice(0, 5).map(r => (
                                        <tr key={r.id} className="border-b border-gray-50 hover:bg-[#FDF2E9] transition-colors">
                                            <td className="py-3">{r.date}</td>
                                            <td className="py-3 font-bold">
                                                {{overtime:'加班', sick:'病假', personal:'事假', unpaid:'無薪假', family_care:'家庭照顧假', disaster:'天災(颱風、地震)', annual:'特休', punch_in:'上班打卡', punch_out:'下班打卡'}[r.type] || '獎金'}
                                            </td>
                                            <td className="py-3">{r.time ? r.time : (r.hours > 0 ? `${r.hours} h` : '-')}</td>
                                            <td className={`py-3 font-bold ${r.amount > 0 ? 'text-emerald-500' : (r.amount < 0 ? 'text-red-500' : 'text-gray-400')}`}>{isAmountMasked ? '***' : r.amount}</td>
                                        </tr>
                                    ))}
                                    {yearlyRecords.length === 0 && <tr><td colSpan="4" className="py-6 text-gray-400">目前尚無紀錄</td></tr>}
                                </tbody>
                            </table>
                        </div>
                        <div className="card-data-container">
                            <div className="flex justify-between items-center mb-6">
                                <h2 className="text-lg font-bold text-gray-800">假別餘額 (時數)</h2>
                                <button onClick={() => setCurrentView('leave')} className="text-[var(--primary)] text-sm flex items-center hover:underline whitespace-nowrap">管理 <i data-lucide="chevron-right" className="w-4 h-4"></i></button>
                            </div>
                            <div className="space-y-6">
                                {[ 
                                    { key: 'annual', name: '特休假', icon: 'star', color: 'bg-blue-500', iconBg: 'bg-blue-100 text-blue-500' },
                                    { key: 'sick', name: '病假', icon: 'thermometer', color: 'bg-green-500', iconBg: 'bg-green-100 text-green-500' },
                                    { key: 'personal', name: '事假', icon: 'clipboard-list', color: 'bg-orange-400', iconBg: 'bg-orange-100 text-orange-400' },
                                    { key: 'family_care', name: '家庭照顧假', icon: 'baby', color: 'bg-teal-500', iconBg: 'bg-teal-100 text-teal-500' }
                                ].map(item => {
                                    const total = leaveLimits[item.key];
                                    const used = leaveUsed[item.key];
                                    const bal = Math.max(0, total - used);
                                    return (
                                        <div key={item.key}>
                                            <div className="flex justify-between items-center mb-2">
                                                <div className="flex items-center gap-3">
                                                    <div className={`w-8 h-8 rounded-lg flex items-center justify-center ${item.iconBg}`}><i data-lucide={item.icon} className="w-4 h-4"></i></div>
                                                    <span className="font-medium text-gray-700">{item.name}</span>
                                                </div>
                                                <div className="text-sm">
                                                    <span className="font-bold text-gray-800">{bal}</span> / <span className="text-gray-400">{total}</span>
                                                </div>
                                            </div>
                                            <div className="w-full bg-gray-100 h-2 rounded-full overflow-hidden">
                                                <div className={`h-full ${item.color} rounded-full`} style={{ width: `${total > 0 ? (used / total) * 100 : 0}%` }}></div>
                                            </div>
                                        </div>
                                    )
                                })}
                            </div>
                        </div>
                    </div>
                    
                    <div className="grid grid-cols-1 md:grid-cols-2 gap-6">
                        <div className="card-data-container overflow-x-auto">
                            <div className="flex justify-between items-center mb-6 min-w-min">
                                <h2 className="text-lg font-bold text-gray-800">近期加班申請</h2>
                                <button onClick={() => setCurrentView('records')} className="text-[var(--primary)] text-sm font-medium hover:underline whitespace-nowrap ml-4">查看全部</button>
                            </div>
                            <div className="space-y-4 text-sm min-w-[300px]">
                                {data.records.filter(r => r.type === 'overtime').length === 0 ? (
                                    <div className="text-gray-400 py-4 text-center">目前尚無加班紀錄</div>
                                ) : (
                                    data.records.filter(r => r.type === 'overtime').sort((a,b) => new Date(b.date) - new Date(a.date)).slice(0, 5).map(r => {
                                        const d = new Date(r.date);
                                        const weekDays = ['日', '一', '二', '三', '四', '五', '六'];
                                        return (
                                            <div key={r.id} className="flex justify-between items-center pb-3 border-b border-gray-50">
                                                <span className="text-gray-500 w-32">{r.date.replace(/-/g, '/')} ({weekDays[d.getDay()]})</span>
                                                <span className="font-bold w-12 text-center">加班</span>
                                                <span className="font-bold w-16 text-right">{r.hours.toFixed(1)} 小時</span>
                                                <span className="ml-auto px-3 py-1 rounded-full border border-green-200 text-green-500 bg-green-50 text-xs">已登記</span>
                                            </div>
                                        );
                                    })
                                )}
                            </div>
                        </div>
                                    

                        <div className="card-data-container">
                            <h2 className="text-lg font-bold text-gray-800 mb-6">出勤狀態 (本月)</h2>
                            <div className="flex flex-col xl:flex-row items-center justify-around gap-6">
                                <div className="relative w-36 h-36 rounded-full flex items-center justify-center shrink-0" style={{
                                    background: `conic-gradient(#3B82F6 0% ${(actualWorkDays/weekdaysInMonth)*100}%, #F97316 ${(actualWorkDays/weekdaysInMonth)*100}% ${((actualWorkDays+leaveDaysThisMonth)/weekdaysInMonth)*100}%, #22C55E ${((actualWorkDays+leaveDaysThisMonth)/weekdaysInMonth)*100}% ${((actualWorkDays+leaveDaysThisMonth+otDaysThisMonth)/weekdaysInMonth)*100}%, #9CA3AF ${((actualWorkDays+leaveDaysThisMonth+otDaysThisMonth)/weekdaysInMonth)*100}% 100%)`
                                }}>
                                    <div className="w-28 h-28 bg-white rounded-full flex flex-col items-center justify-center">
                                        <span className="text-xs text-gray-500 mb-1">應出勤</span>
                                        <span className="text-xl font-bold text-gray-800">{weekdaysInMonth} 天</span>
                                    </div>
                                </div>
                                <div className="space-y-4 text-sm w-full md:w-auto">
                                    <div className="flex items-center justify-between xl:justify-start gap-6">
                                        <div className="flex items-center gap-2 w-16"><div className="w-3 h-3 rounded-full bg-blue-500"></div><span className="text-gray-700">出勤</span></div>
                                        <span className="text-gray-600 font-medium">{actualWorkDays} 天 ({Math.round((actualWorkDays/weekdaysInMonth)*100 || 0)}%)</span>
                                    </div>
                                    <div className="flex items-center justify-between xl:justify-start gap-6">
                                        <div className="flex items-center gap-2 w-16"><div className="w-3 h-3 rounded-full bg-orange-500"></div><span className="text-gray-700">請假</span></div>
                                        <span className="text-gray-600 font-medium">{leaveDaysThisMonth} 天 ({Math.round((leaveDaysThisMonth/weekdaysInMonth)*100 || 0)}%)</span>
                                    </div>
                                    <div className="flex items-center justify-between xl:justify-start gap-6">
                                        <div className="flex items-center gap-2 w-16"><div className="w-3 h-3 rounded-full bg-green-500"></div><span className="text-gray-700">加班</span></div>
                                        <span className="text-gray-600 font-medium">{otDaysThisMonth} 天 ({Math.round((otDaysThisMonth/weekdaysInMonth)*100 || 0)}%)</span>
                                    </div>
                                    <div className="flex items-center justify-between xl:justify-start gap-6">
                                        <div className="flex items-center gap-2 w-16"><div className="w-3 h-3 rounded-full bg-gray-400"></div><span className="text-gray-700">未打卡</span></div>
                                        <span className="text-gray-600 font-medium">{missedDaysThisMonth} 天 ({Math.round((missedDaysThisMonth/weekdaysInMonth)*100 || 0)}%)</span>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            );

            const [attForm, setAttForm] = useState({ date: new Date().toISOString().split('T')[0], type: 'overtime', hours: 1 });
            const [bonusForm, setBonusForm] = useState({ date: new Date().toISOString().split('T')[0], type: 'bonus_festival', amount: '' });
            const [editState, setEditState] = useState(null); // 紀錄編輯狀態
            
            const handleAddAttendance = (e) => {
                e.preventDefault();
                let amt = 0;
                if (attForm.type === 'overtime') {
                    const r1 = 1.34, r2 = 1.67;
                    amt = attForm.hours <= 2 ? Math.round(exactHourlyWage * r1 * attForm.hours) : Math.round((exactHourlyWage * r1 * 2) + (exactHourlyWage * r2 * (attForm.hours - 2)));
                }
                
                let newRecords = [{ id: Date.now(), date: attForm.date, type: attForm.type, hours: attForm.hours, amount: amt }, ...data.records];
                
                if (attForm.type === 'overtime') {
                    const punchOutIndex = newRecords.findIndex(r => r.date === attForm.date && r.type === 'punch_out');
                    
                    // 解析設定的下班時間並推算
                    const [endH, endM] = (data.workEndTime || '18:00').split(':').map(Number);
                    const targetDate = new Date(2000, 0, 1, endH, endM);
                    targetDate.setMinutes(targetDate.getMinutes() + attForm.hours * 60);
                    
                    let finalMin = targetDate.getMinutes() + 1 + Math.floor(Math.random() * 3);
                    let finalHour = targetDate.getHours();
                    if (finalMin >= 60) { finalHour += 1; finalMin -= 60; }
                    const timeStr = `${String(finalHour).padStart(2, '0')}:${String(finalMin).padStart(2, '0')}`;
                    
                    if (punchOutIndex !== -1) {
                        newRecords[punchOutIndex] = { ...newRecords[punchOutIndex], time: timeStr };
                    } else {
                        newRecords.push({ id: Date.now() + 1, date: attForm.date, type: 'punch_out', time: timeStr, hours: 0, amount: 0 });
                    }
                }
                syncToCloud({ ...data, records: newRecords }, true);
                alert('申報成功！');
            };

            const handleAddBonus = (e) => {
                e.preventDefault();
                if (!bonusForm.amount || bonusForm.amount <= 0) return alert('請輸入有效金額');
                syncToCloud({ ...data, records: [{ id: Date.now(), date: bonusForm.date, type: bonusForm.type, hours: 0, amount: Number(bonusForm.amount) }, ...data.records] }, true);
                setBonusForm({...bonusForm, amount: ''});
                alert('獎金新增成功！');
            };

            const handleAddLeave = (e) => {
                e.preventDefault();
                let newRecords = [...data.records];
                let current = new Date(leaveForm.date);
                let end = new Date(leaveForm.endDate || leaveForm.date);
                let addedCount = 0;

                while (current <= end) {
                    const y = current.getFullYear();
                    const m = String(current.getMonth() + 1).padStart(2, '0');
                    const d = String(current.getDate()).padStart(2, '0');
                    const dateStr = `${y}-${m}-${d}`;
                    const dayOfWeek = current.getDay();
                    
                    let isWorkDay = (dayOfWeek !== 0 && dayOfWeek !== 6);
                    if (data.holidays && data.holidays[dateStr] !== undefined) {
                        isWorkDay = !data.holidays[dateStr];
                    }

                    if (isWorkDay) {
                        let amt = 0;
                        if (['personal', 'unpaid', 'family_care'].includes(leaveForm.type)) amt = -Math.round(exactHourlyWage * leaveForm.hours);
                        if (leaveForm.type === 'disaster' && data.disasterLeaveDeduct !== false) amt = -Math.round(exactHourlyWage * leaveForm.hours);
                        if (leaveForm.type === 'sick') amt = -Math.round((exactHourlyWage / 2) * leaveForm.hours);
                        newRecords.push({ id: Date.now() + Math.random(), date: dateStr, type: leaveForm.type, hours: leaveForm.hours, amount: amt, startTime: leaveForm.startTime, endTime: leaveForm.endTime });
                        addedCount++;
                    }
                    current.setDate(current.getDate() + 1);
                }

                if (addedCount > 0) {
                    newRecords.sort((a,b) => new Date(b.date) - new Date(a.date));
                    syncToCloud({ ...data, records: newRecords }, true);
                    alert(`請假申報成功！系統已自動排除假日，共計寫入 ${addedCount} 天紀錄`);
                } else {
                    alert('申報失敗：所選期間內沒有需要出勤的工作日！');
                }
            };

            const renderForms = () => (
                <div className="fade-in max-w-4xl mx-auto space-y-6">
                    <h2 className="text-xl font-bold text-gray-800 mb-6">出勤打卡與申報</h2>
                    
                    <div className="card-data-container border-l-4 border-blue-500 mb-6 flex flex-col md:flex-row justify-between items-start md:items-center gap-4 bg-blue-50/30">
                        <div className="w-full">
                            <h3 className="text-lg font-bold text-gray-800 flex items-center gap-2"><i data-lucide="clock" className="text-blue-500"></i> 每日出勤打卡</h3>
                            <p className="text-xs text-gray-500 mt-1 mb-3">若未手動打卡，系統將於規定時段自動推算並產生紀錄。</p>
                            <div className="flex gap-4">
                                <div className="flex flex-col">
                                    <label className="text-xs font-bold text-gray-500 mb-1">設定上班時間</label>
                                    <input type="time" value={data.workStartTime || '09:00'} onChange={e => syncToCloud({...data, workStartTime: e.target.value})} className="px-2 py-1 border rounded text-sm bg-white" />
                                </div>
                                <div className="flex flex-col">
                                    <label className="text-xs font-bold text-gray-500 mb-1">設定下班時間</label>
                                    <input type="time" value={data.workEndTime || '18:00'} onChange={e => syncToCloud({...data, workEndTime: e.target.value})} className="px-2 py-1 border rounded text-sm bg-white" />
                                </div>
                            </div>
                        </div>
                        <div className="flex flex-col sm:flex-row gap-4 w-full md:w-auto mt-4 md:mt-0">
                            <button onClick={() => handleManualPunch('punch_in')} className="bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 md:py-2 px-6 rounded-lg transition-all shadow-sm w-full sm:w-auto text-lg md:text-base">上班打卡</button>
                            <button onClick={() => handleManualPunch('punch_out')} className="bg-slate-600 hover:bg-slate-700 text-white font-bold py-3 md:py-2 px-6 rounded-lg transition-all shadow-sm w-full sm:w-auto text-lg md:text-base">下班打卡</button>
                        </div>
                    </div>

                    <div className="card-data-container border-l-4 border-emerald-500">
                        <h3 className="text-lg font-bold text-gray-800 mb-4 flex items-center gap-2"><i data-lucide="calendar-check" className="text-emerald-500"></i> 出勤異動申報</h3>
                        <form onSubmit={handleAddAttendance} className="grid grid-cols-1 md:grid-cols-4 gap-4 items-end">
                            <div>
                                <label className="block text-xs font-bold text-gray-500 mb-1">日期</label>
                                <input type="date" required value={attForm.date} onChange={e => setAttForm({...attForm, date: e.target.value})} className="w-full px-3 py-2 border rounded-lg font-bold" />
                            </div>
                            <div>
                                <label className="block text-xs font-bold text-gray-500 mb-1">類別</label>
                                <select value={attForm.type} onChange={e => setAttForm({...attForm, type: e.target.value})} className="w-full px-3 py-2 border rounded-lg font-bold">
                                    <option value="overtime">平日加班</option>
                                </select>
                            </div>
                            <div>
                                <label className="block text-xs font-bold text-gray-500 mb-1">時數</label>
                                <select value={attForm.hours} onChange={e => setAttForm({...attForm, hours: Number(e.target.value)})} className="w-full px-3 py-2 border rounded-lg font-bold bg-white">
                                    {Array.from({length: 15}, (_, i) => 1 + i * 0.5).map(h => (
                                        <option key={h} value={h}>{h} 小時</option>
                                    ))}
                                </select>
                            </div>
                            <button type="submit" className="bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-3 md:py-2 rounded-lg transition-all shadow-sm w-full">申報送出</button>
                        </form>
                    </div>

                    <div className="card-data-container border-l-4 border-yellow-500">
                        <h3 className="text-lg font-bold text-gray-800 mb-4 flex items-center gap-2"><i data-lucide="sack-dollar" className="text-yellow-500"></i> 額外獎金收入申報</h3>
                        <form onSubmit={handleAddBonus} className="grid grid-cols-1 md:grid-cols-4 gap-4 items-end">
                            <div>
                                <label className="block text-xs font-bold text-gray-500 mb-1">發放日期</label>
                                <input type="date" required value={bonusForm.date} onChange={e => setBonusForm({...bonusForm, date: e.target.value})} className="w-full px-3 py-2 border rounded-lg font-bold" />
                            </div>
                            <div>
                                <label className="block text-xs font-bold text-gray-500 mb-1">獎金名目</label>
                                <select value={bonusForm.type} onChange={e => setBonusForm({...bonusForm, type: e.target.value})} className="w-full px-3 py-2 border rounded-lg font-bold">
                                    <option value="bonus_festival">三節獎金</option>
                                    <option value="bonus_incentive">激勵獎金</option>
                                    <option value="bonus_yearend">年終獎金</option>
                                    <option value="bonus_birthday">生日禮金</option>
                                </select>
                            </div>
                            <div>
                                <label className="block text-xs font-bold text-gray-500 mb-1">金額 (NT$)</label>
                                <input type="number" required min="1" value={bonusForm.amount} onChange={e => setBonusForm({...bonusForm, amount: e.target.value})} className="w-full px-3 py-2 border rounded-lg font-bold" />
                            </div>
                            <button type="submit" className="bg-yellow-500 hover:bg-yellow-600 text-white font-bold py-3 md:py-2 rounded-lg transition-all shadow-sm w-full">新增獎金</button>
                        </form>
                    </div>
                </div>
            );

            const renderRecords = () => (
                <div className="fade-in card-data-container">
                    <div className="flex justify-between items-center mb-6">
                        <h2 className="text-xl font-bold text-gray-800">出勤紀錄與異動明細</h2>
                        <input type="month" value={targetMonth} onChange={(e) => setTargetMonth(e.target.value)} className="px-4 py-2 border rounded-lg font-bold text-gray-700 outline-none focus:border-[var(--primary)]" />
                    </div>
                    <table className="w-full text-center text-sm">
                        <thead className="bg-slate-50">
                            <tr className="text-gray-500 border-b border-gray-200">
                                <th className="py-3 font-medium">日期</th>
                                <th className="py-3 font-medium">類別</th>
                                <th className="py-3 font-medium">時數/時間</th>
                                <th className="py-3 font-medium">增減金額</th>
                                <th className="py-3 font-medium">操作</th>
                            </tr>
                        </thead>
                        <tbody>
                            {monthlyRecords.length === 0 ? (
                                <tr><td colSpan="5" className="py-12 text-gray-400 font-bold">本月無紀錄</td></tr>
                            ) : (
                                monthlyRecords.map(r => editState?.id === r.id ? (
                                    <tr key={r.id} className="border-b border-gray-100 bg-blue-50/50">
                                        <td className="py-2"><input type="date" value={editState.date} onChange={e=>setEditState({...editState, date: e.target.value})} className="border p-1 rounded w-full text-xs" /></td>
                                        <td className="py-2">
                                            <select value={editState.type} onChange={e=>setEditState({...editState, type: e.target.value})} className="border p-1 rounded w-full text-xs">
                                                <option value="punch_in">上班打卡</option>
                                                <option value="punch_out">下班打卡</option>
                                                <option value="overtime">加班</option>
                                                <option value="annual">特休</option>
                                                <option value="sick">病假</option>
                                                <option value="personal">事假</option>
                                                <option value="unpaid">無薪假</option>
                                                <option value="family_care">家庭照顧假</option>
                                                <option value="disaster">天災(颱風、地震)</option>
                                                <option value="bonus_festival">三節獎金</option>
                                                <option value="bonus_incentive">激勵獎金</option>
                                                <option value="bonus_yearend">年終獎金</option>
                                                <option value="bonus_birthday">生日禮金</option>
                                            </select>
                                        </td>
                                        <td className="py-2">
                                            {['punch_in', 'punch_out'].includes(editState.type) ? 
                                                <input type="time" value={editState.time || ''} onChange={e=>setEditState({...editState, time: e.target.value, hours: 0})} className="border p-1 rounded w-full text-xs" /> :
                                                <input type="number" step="0.5" value={editState.hours || 0} onChange={e=>setEditState({...editState, hours: Number(e.target.value), time: null})} className="border p-1 rounded w-full text-xs" />
                                            }
                                        </td>

                                <div className="flex justify-between"><span className="text-gray-600">本月設定底薪</span><span>{isAmountMasked ? '***' : currentSalary.toLocaleString()}</span></div>
                                
                                {/* 加班費區塊 */}

                                        <span className="text-gray-600">
                                            {r.type === 'bonus_festival' ? '三節獎金' : r.type === 'bonus_incentive' ? '激勵獎金' : r.type === 'bonus_yearend' ? '年終獎金' : r.type === 'bonus_birthday' ? '生日禮金' : '其他獎金'}

                                    <ul className="space-y-1 font-medium">
                                        <li>目前設定底薪：NT$ {isAmountMasked ? '***' : currentSalary.toLocaleString()}</li>
                                        <li className="text-[#D35400]">勞保投保級距：NT$ {isAmountMasked ? '***' : laborBracket.toLocaleString()}</li>
                                        <li className="text-[#D35400]">健保投保級距：NT$ {isAmountMasked ? '***' : healthBracket.toLocaleString()}</li>
