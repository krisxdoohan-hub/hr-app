                        </div>
                    </div>
                </div>
            );

            const handleHolidayImport = (e) => {
                const file = e.target.files[0];
                if (!file) return;
                
                const keepOld = window.confirm('是否要保留系統中既有的行事曆資料？\n\n點擊「確定」：保留舊資料，並與新檔案合併\n點擊「取消」：清空舊資料，完全以這次匯入的檔案為主');
                
                const reader = new FileReader();
                reader.onload = (ev) => {
                    const text = ev.target.result;
                    let validCount = 0;
                    const newHolidays = keepOld ? { ...(data.holidays || {}) } : {};

                    try {
                        if (file.name.toLowerCase().endsWith('.csv')) {
                            const lines = text.split('\n').filter(line => line.trim().length > 0);
                            if (lines.length > 1) {
                                const headers = lines[0].split(',').map(h => h.trim().replace(/["\r]/g, '').toLowerCase());
                                const dateIdx = headers.findIndex(h => h === 'date' || h.includes('日期'));
                                const holidayIdx = headers.findIndex(h => h === 'isholiday' || h.includes('放假') || h === 'is_holiday');

                                if (dateIdx !== -1 && holidayIdx !== -1) {
                                    for (let i = 1; i < lines.length; i++) {
                                        const cols = lines[i].split(',');
                                        if (cols.length > Math.max(dateIdx, holidayIdx)) {
                                            const dateVal = cols[dateIdx].replace(/["\r]/g, '').trim();
                                            const isH = cols[holidayIdx].replace(/["\r]/g, '').trim();
                                            
                                            const rawDate = dateVal.replace(/[\/\-]/g, '');
                                            if (rawDate.length === 8 && !isNaN(rawDate)) {
                                                const y = rawDate.substring(0, 4);
                                                const m = rawDate.substring(4, 6);
                                                const d = rawDate.substring(6, 8);
                                                const isHolidayBool = (isH === '是' || String(isH).toLowerCase() === 'true' || isH === '1' || String(isH).toLowerCase() === 'y');
                                                newHolidays[`${y}-${m}-${d}`] = isHolidayBool;
                                                validCount++;
                                            }
                                        }
                                    }
                                }
                            }
                        } else {
                            const imported = JSON.parse(text);
                            imported.forEach(item => {
                                const dateKey = Object.keys(item).find(k => k.toLowerCase() === 'date' || k.includes('日期'));
                                const holidayKey = Object.keys(item).find(k => k.toLowerCase().includes('isholiday') || k.toLowerCase().includes('is_holiday') || k.includes('放假'));

                                if (dateKey && holidayKey) {
                                    const dateVal = item[dateKey];
                                    const isH = item[holidayKey];

                                    if (dateVal !== undefined && isH !== undefined && dateVal !== null) {
                                        const rawDate = String(dateVal).replace(/[\/\-]/g, '');
                                        if (rawDate.length === 8 && !isNaN(rawDate)) {
                                            const y = rawDate.substring(0, 4);
                                            const m = rawDate.substring(4, 6);
                                            const d = rawDate.substring(6, 8);
                                            const isHolidayBool = (isH === '是' || isH === true || String(isH).toLowerCase() === 'true' || isH === '1' || String(isH).toLowerCase() === 'y');
                                            newHolidays[`${y}-${m}-${d}`] = isHolidayBool;
                                            validCount++;
                                        }
                                    }
                                }
                            });
                        }

                        if (validCount === 0) {
                            alert('匯入警告：未能解析任何假日資料！請確認檔案為政府下載之 CSV 或 JSON，且包含「日期」與「是否放假」欄位。');
                            return;
                        }

                        syncToCloud({ ...data, holidays: newHolidays }, true);
                        alert(`年度行事曆載入成功！共匯入 ${validCount} 筆資料。`);
                    } catch (err) { 
                        alert('匯入失敗，請確認檔案格式是否正確。'); 
                        console.error(err);
                    }
                    e.target.value = ''; 
                };
                reader.readAsText(file, 'UTF-8');
            };

            const handleJSONImport = (e) => {
                const file = e.target.files[0];
                if (!file) return;
                const reader = new FileReader();
                reader.onload = (ev) => {
                    try {
                        const imported = JSON.parse(ev.target.result);
                        const mergedData = {
                            ...data,
                            passcode: imported.passcode || data.passcode,
                            gasUrl: imported.gasUrl || data.gasUrl,
                            monthlySalaries: imported.monthlySalaries || {},
                            dependentsCount: imported.dependentsCount || 0,
                            employmentStartDate: imported.employmentStartDate || '2023-08-07',
                            historicalLeave: imported.historicalLeave || { annual: 0, sick: 0, personal: 0 },
                            records: imported.records || [],
                            holidays: imported.holidays || data.holidays || {},
                            disasterLeaveDeduct: imported.disasterLeaveDeduct !== undefined ? imported.disasterLeaveDeduct : (data.disasterLeaveDeduct !== undefined ? data.disasterLeaveDeduct : true)
                        };
                        syncToCloud(mergedData, true);
                        alert('備份紀錄與設定已成功載入！');
                    } catch (err) { alert('匯入失敗，檔案格式錯誤。'); }
                    e.target.value = '';
                };
                reader.readAsText(file);
            };

            const handleCopyCode = () => {
                try {
                    // 終極縮短：完全拋棄 records 與 holidays，只轉移核心設定與雲端金鑰 (gasUrl)
                    const shortData = {
                        p: data.passcode, g: data.gasUrl, m: data.monthlySalaries, d: data.dependentsCount, e: data.employmentStartDate,
                        h: data.historicalLeave ? { a: data.historicalLeave.annual, s: data.historicalLeave.sick, p: data.historicalLeave.personal } : { a: 0, s: 0, p: 0 }
                    };
                    const compressed = LZString.compressToBase64(JSON.stringify(shortData));
                    setTransferModal({ isOpen: true, mode: 'copy', text: compressed });
                } catch (err) { alert('代碼壓縮失敗：' + err.message); }
            };

            const handlePasteCode = () => {
                setTransferModal({ isOpen: true, mode: 'paste', text: '' });
            };
            
            const processPastedCode = async () => {
                if (!transferModal.text) return alert('請先貼上代碼');
                try {
                    const decompressedStr = LZString.decompressFromBase64(transferModal.text.trim());
                    if (!decompressedStr) return alert('解壓縮失敗：代碼格式不正確或內容已損毀！');
                    
                    const short = JSON.parse(decompressedStr);
                    const importedSettings = {
                        passcode: short.p || '123456', gasUrl: short.g || '', monthlySalaries: short.m || {}, dependentsCount: short.d || 0, employmentStartDate: short.e || '2023-08-07',
                        historicalLeave: short.h ? { annual: short.h.a || 0, sick: short.h.s || 0, personal: short.h.p || 0 } : { annual: 0, sick: 0, personal: 0 }
                    };
                    
                    // 先套用設定，保留既有的 records 與 holidays 結構避免出錯
                    const mergedData = { ...data, ...importedSettings };
                    setData(mergedData);
                    localStorage.setItem(STORAGE_KEY, JSON.stringify(mergedData));
                    setTransferModal({ isOpen: false, mode: '', text: '' });
                    
                    alert('核心參數載入成功！系統即將利用連線網址自動從雲端下載歷史出勤紀錄...');
                    
                    // 利用轉移過來的 gasUrl 自動去雲端把龐大的歷史資料抓下來補齊
                    if (importedSettings.gasUrl) {
                        setIsLoading(true);
                        try {
                            const res = await fetch(importedSettings.gasUrl);
                            const cloudData = await res.json();
                            if (Object.keys(cloudData).length > 0) {
                                setData(cloudData);
                                localStorage.setItem(STORAGE_KEY, JSON.stringify(cloudData));
                                alert('雲端歷史資料同步完成！');
                            }
                        } catch (err) { alert('設定已成功，但從雲端讀取紀錄失敗，請確認 GAS 網址是否正確或網路狀態。'); }
                        setIsLoading(false);
                    }
                } catch (err) { alert('載入失敗：此代碼無效或版本不相容。'); }
            };

            const renderEmployee = () => (
                <div className="fade-in max-w-3xl mx-auto space-y-6">
                    <h2 className="text-xl font-bold text-gray-800 mb-6">員工管理與系統設定</h2>
                    
                    <div className="card-data-container border-t-4 border-[var(--primary)]">
                        <h3 className="text-lg font-bold text-gray-800 mb-4">基本參數設定</h3>
                        <div className="grid grid-cols-1 md:grid-cols-2 gap-6">
                            <div>
                                <label className="block text-xs font-bold text-gray-500 mb-1">當月設定底薪 (NT$)</label>
                                <input type="number" value={currentSalary} onChange={e => syncToCloud({...data, monthlySalaries: {...data.monthlySalaries, [targetMonth]: Number(e.target.value)}})} className="w-full px-3 py-2 border rounded-lg font-bold focus:border-[var(--primary)] outline-none" />
                            </div>
                            <div>
                                <label className="block text-xs font-bold text-gray-500 mb-1">全勤獎金金額 (NT$)</label>
                                <input type="number" value={data.fullAttendanceBonus || 0} onChange={e => syncToCloud({...data, fullAttendanceBonus: Number(e.target.value)})} className="w-full px-3 py-2 border rounded-lg font-bold focus:border-[var(--primary)] outline-none" />
                            </div>
                            <div>
                                <label className="block text-xs font-bold text-gray-500 mb-1">健保依附人數</label>
                                <select value={data.dependentsCount} onChange={e => syncToCloud({...data, dependentsCount: Number(e.target.value)})} className="w-full px-3 py-2 border rounded-lg font-bold bg-white focus:border-[var(--primary)] outline-none">
                                    <option value="0">僅保本人</option>
                                    <option value="1">1 位眷屬</option>
                                    <option value="2">2 位眷屬</option>
                                    <option value="3">3 位(含)以上</option>
                                </select>
                            </div>
                            <div>
                                <label className="block text-xs font-bold text-gray-500 mb-1">到職日 (用於計算特休週年制)</label>
                                <input type="date" value={data.employmentStartDate} onChange={e => syncToCloud({...data, employmentStartDate: e.target.value})} className="w-full px-3 py-2 border rounded-lg font-bold focus:border-[var(--primary)] outline-none" />
                            </div>
                            <div className="md:col-span-2">
                                <label className="block text-xs font-bold text-gray-500 mb-1">天災假(停班停課)扣薪設定</label>
                                <select value={data.disasterLeaveDeduct !== false ? "true" : "false"} onChange={e => syncToCloud({...data, disasterLeaveDeduct: e.target.value === "true"})} className="w-full px-3 py-2 border rounded-lg font-bold bg-white focus:border-[var(--primary)] outline-none">
                                    <option value="true">扣除當日薪資 (預設)</option>
                                    <option value="false">不扣薪 (視為給薪假)</option>
                                </select>
                            </div>
                        </div>
                    </div>

                    <div className="card-data-container border-t-4 border-slate-700">
                        <h3 className="text-lg font-bold text-gray-800 mb-4 flex items-center gap-2"><i data-lucide="database" className="text-slate-600"></i> 資料轉移與雲端備份</h3>
                        <div className="space-y-4">
                            <div>
                                <label className="block text-xs font-bold text-gray-500 mb-1">GAS 雲端資料庫網址 (Web App URL)</label>
                                <input type="text" value={data.gasUrl} onChange={e => syncToCloud({...data, gasUrl: e.target.value})} placeholder="https://script.google.com/macros/s/..." className="w-full px-3 py-2 border rounded-lg font-bold focus:border-[var(--primary)] outline-none text-xs text-blue-600 bg-blue-50/50" />
                            </div>
                            <div className="grid grid-cols-2 md:grid-cols-4 gap-4 pt-2">
                                <button onClick={handleCopyCode} className="bg-white border border-green-600 py-3 rounded-xl font-bold text-sm text-green-700 shadow-sm flex items-center justify-center gap-2 hover:bg-green-50 transition-all w-full">
                                    <i data-lucide="copy"></i> 複製代碼
                                </button>
                                <button onClick={handlePasteCode} className="bg-white border border-green-600 py-3 rounded-xl font-bold text-sm text-green-700 shadow-sm flex items-center justify-center gap-2 hover:bg-green-50 transition-all w-full">
                                    <i data-lucide="clipboard-paste"></i> 貼上代碼
                                </button>
                                <div className="relative w-full">
                                    <input type="file" onChange={handleJSONImport} accept="application/json" className="absolute inset-0 opacity-0 cursor-pointer z-10 w-full" />
                                    <div className="h-full bg-emerald-50 border border-emerald-200 py-3 rounded-xl font-bold text-sm text-center text-emerald-700 shadow-sm flex items-center justify-center gap-2 pointer-events-none transition-all w-full">
                                        <i data-lucide="upload-cloud"></i> 匯入 JSON
                                    </div>
                                </div>
                                <div className="relative w-full">
                                    <input type="file" onChange={handleHolidayImport} accept=".json,.csv,application/json,text/csv" className="absolute inset-0 opacity-0 cursor-pointer z-10 w-full" />
                                    <div className="h-full bg-orange-50 border border-orange-200 py-3 rounded-xl font-bold text-sm text-center text-orange-700 shadow-sm flex items-center justify-center gap-2 pointer-events-none transition-all w-full">
                                        <i data-lucide="calendar"></i> 匯入年度行事曆
                                    </div>
                                </div>
                                <button onClick={() => {
                                    if(window.confirm('確定要清空系統內所有的行事曆資料嗎？\n出勤天數將恢復預設的週休二日計算。')) {
                                        syncToCloud({...data, holidays: {}});
                                        alert('已成功清空所有行事曆資料！請重新匯入正確的檔案。');
                                    }
                                }} className="flex-1 bg-red-50 border border-red-200 py-3 rounded-xl font-bold text-sm text-center text-red-700 shadow-sm flex items-center justify-center gap-2 hover:bg-red-100 transition-all w-full">
                                    <i data-lucide="trash-2"></i> 清空行事曆
                                </button>
                                <button onClick={() => {
                                    const blob = new Blob([JSON.stringify(data, null, 2)], { type: "application/json" });
                                    const url = URL.createObjectURL(blob);
                                    const a = document.createElement('a'); a.href = url; a.download = `HR_Fusion_Backup_${new Date().toISOString().split('T')[0]}.json`;
                                    document.body.appendChild(a); a.click(); document.body.removeChild(a); URL.revokeObjectURL(url);
                                }} className="flex-1 bg-indigo-50 border border-indigo-200 py-3 rounded-xl font-bold text-sm text-center text-indigo-700 shadow-sm flex items-center justify-center gap-2 hover:bg-indigo-100 transition-all w-full">
                                    <i data-lucide="download-cloud"></i> 下載本機存檔
                                </button>
                            </div>
                        </div>
                    </div>

                    <div className="card-data-container border-2 border-red-100">
                        <h3 className="text-lg font-bold text-red-600 mb-4 flex items-center gap-2"><i data-lucide="shield-alert" className="text-red-500"></i> 系統安全設定</h3>
                        <div>
                            <label className="block text-xs font-bold text-gray-500 mb-1">變更解鎖密碼 (6碼數字)</label>
                            <input type="password" maxLength={6} placeholder="輸入新密碼" onBlur={e => {
                                if(e.target.value.length === 6) { syncToCloud({...data, passcode: e.target.value}); alert('密碼更新成功'); e.target.value=''; }
                            }} className="w-full px-3 py-2 border rounded-lg font-bold tracking-widest text-center focus:border-red-400 outline-none" />
                        </div>
                    </div>
                </div>
            );

            if (isLocked) return <LockScreen onUnlock={handleUnlock} error={lockError} />;

            const navItems = [
                { id: 'dashboard', label: '首頁總覽', emoji: '🏠' },
                { id: 'clockin', label: '出勤打卡', emoji: '⏱️' },
                { id: 'records', label: '出勤紀錄', emoji: '📋' },
                { id: 'leave', label: '請假管理', emoji: '✈️' },
                { id: 'salary', label: '薪資查詢', emoji: '💰' },
                { id: 'employee', label: '員工管理', emoji: '⚙️' },
            ];

            return (
                <div className="flex min-h-screen pb-20 md:pb-0">
                    {/* 桌機版左側導覽列 (手機版隱藏) */}
                    <div className="hidden md:flex w-64 bg-[#1E293B] h-screen flex-col justify-between fixed left-0 top-0 text-sm z-40">
                        <div>
                            <div className="flex items-center gap-3 p-6 text-white text-xl font-bold">
                                <div className="w-8 h-8 bg-white rounded-full flex items-center justify-center text-[#1E293B]">▲</div>
                                <div className="flex flex-col">
                                    <span>HR 出勤系統</span>
                                    <span className="text-[10px] text-gray-400 font-normal">{APP_VERSION}</span>
                                </div>
                            </div>
                            <nav className="px-4 space-y-2 mt-4">
                                {navItems.map(item => (
                                    <button key={item.id} onClick={() => setCurrentView(item.id)} className={`w-full flex items-center gap-3 px-4 py-3 ${currentView === item.id ? 'sidebar-item-active' : 'sidebar-item'}`}>
                                        <span className="text-lg">{item.emoji}</span> {item.label}
                                    </button>
                                ))}
                            </nav>
                        </div>
                    </div>

                    {/* 手機版底部導覽列 (桌機版隱藏) */}
                    <div className="md:hidden fixed bottom-0 left-0 w-full bg-white border-t border-gray-200 z-50 flex justify-around items-center px-1 py-2 pb-safe shadow-[0_-4px_6px_-1px_rgba(0,0,0,0.05)]">
                        {navItems.map(item => (
                            <button key={item.id} onClick={() => setCurrentView(item.id)} className={`flex flex-col items-center justify-center w-16 gap-1 transition-all ${currentView === item.id ? 'text-[var(--primary)] scale-110' : 'text-gray-400 grayscale hover:grayscale-0'}`}>
                                <span className="text-2xl leading-none">{item.emoji}</span>
                                <span className="text-[10px] font-bold whitespace-nowrap">{item.label}</span>
                            </button>
                        ))}
                    </div>
                    
                    {/* 主要內容區塊，針對手機取消左側 margin，並加入溢出隱藏確保排版不破壞 */}
                    <div className="flex-1 flex flex-col md:ml-64 bg-[var(--surface)] relative w-full overflow-x-hidden">
                        <header className="h-16 md:h-20 bg-white flex items-center justify-between px-4 md:px-8 border-b border-gray-100 sticky top-0 z-10 shadow-sm md:shadow-none">
                            <div className="flex items-center gap-2 md:gap-4 truncate">
                                <h1 className="text-lg md:text-xl font-semibold text-gray-800 truncate">{navItems.find(n => n.id === currentView)?.label}</h1>
                                <span className="md:hidden text-[10px] text-gray-400 font-normal border border-gray-200 px-2 py-0.5 rounded-full bg-gray-50 shrink-0">{APP_VERSION}</span>
                                {isLoading && <div className="loader ml-2 md:ml-4"></div>}
                            </div>
                            <div className="flex items-center gap-3 md:gap-6 shrink-0">
                                <button onClick={() => setIsAmountMasked(!isAmountMasked)} className="text-xl md:text-2xl hover:scale-110 transition-transform bg-gray-50 p-2 rounded-full flex items-center justify-center" title="隱私遮蔽">
                                    {isAmountMasked ? '🙈' : '👁️'}
                                </button>
                                <button onClick={fetchFromCloud} className="bg-blue-50 text-blue-600 border border-blue-200 px-3 py-2 md:px-4 md:py-2 rounded-xl text-sm md:text-xs flex items-center gap-1 md:gap-2 font-bold hover:bg-blue-100 transition-colors shadow-sm">
                                    <span className="text-lg md:text-base leading-none">☁️</span> <span className="hidden md:inline">雲端同步</span>
                                </button>
                            </div>
                        </header>
                        
                        <main className="p-4 md:p-8 flex-1 relative w-full max-w-[100vw] overflow-x-auto">
                            {currentView === 'dashboard' && renderDashboard()}
                            {currentView === 'clockin' && renderForms()}
                            {currentView === 'records' && renderRecords()}
                            {currentView === 'leave' && renderLeave()}
                            {currentView === 'salary' && renderSalary()}
                            {currentView === 'employee' && renderEmployee()}
                        </main>

                        {/* 跨裝置代碼轉移專用文字視窗 */}
                        {transferModal.isOpen && (
                            <div className="fixed inset-0 z-[200] bg-slate-900/80 flex items-center justify-center p-4">
                                <div className="bg-white rounded-2xl w-full max-w-md p-6 shadow-2xl relative flex flex-col max-h-[90vh]">
                                    <h3 className="text-xl font-bold text-gray-800 mb-4 flex items-center gap-2">
                                        <i data-lucide={transferModal.mode === 'copy' ? 'copy' : 'clipboard-paste'} className="text-[var(--primary)] w-6 h-6"></i>
                                        {transferModal.mode === 'copy' ? '複製轉移代碼' : '貼上轉移代碼'}
                                    </h3>
                                    <p className="text-sm text-gray-500 mb-4 font-bold">
                                        {transferModal.mode === 'copy' ? '請點擊下方按鈕複製，或手動長按全選下方文字。' : '請長按下方空白框並貼上從另一台裝置取得的代碼。'}
                                    </p>
                                    <textarea 
                                        className="w-full flex-1 min-h-[200px] p-3 border-2 border-gray-200 rounded-xl font-mono text-xs focus:border-[var(--primary)] outline-none resize-none mb-6 break-all"
                                        value={transferModal.text}
                                        onChange={(e) => setTransferModal({...transferModal, text: e.target.value})}
                                        readOnly={transferModal.mode === 'copy'}
                                        placeholder={transferModal.mode === 'paste' ? '在此長按並貼上代碼...' : ''}
                                    ></textarea>
                                    <div className="flex gap-4">
                                        {transferModal.mode === 'copy' ? (
                                            <button onClick={() => { 
                                                navigator.clipboard.writeText(transferModal.text)
                                                    .then(() => alert('✅ 已成功複製到剪貼簿！'))
                                                    .catch(() => alert('⚠️ 瀏覽器阻擋複製，請直接在文字框內長按全選並複製。')); 
                                            }} className="flex-1 btn-primary-action py-3 rounded-xl font-bold">嘗試一鍵複製</button>
                                        ) : (
                                            <button onClick={processPastedCode} className="flex-1 btn-primary-action py-3 rounded-xl font-bold">確認載入</button>
                                        )}
                                        <button onClick={() => setTransferModal({isOpen: false, mode: '', text: ''})} className="flex-1 bg-gray-100 hover:bg-gray-200 text-gray-700 py-3 rounded-xl font-bold transition-colors">取消</button>
                                    </div>
                                </div>
                            </div>
                        )}
                    </div>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
