<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#D35400">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="HR系統">
    <link rel="apple-touch-icon" href="apple-touch-icon.png">
    <link rel="manifest" href='data:application/manifest+json;utf-8,{"name":"HR 出勤系統","short_name":"HR系統","start_url":".","display":"standalone","background_color":"#FDF2E9","theme_color":"#D35400","icons":[{"src":"icon-192.png","sizes":"192x192","type":"image/png"},{"src":"icon-512.png","sizes":"512x512","type":"image/png"}]}'>
    <title>HR 出勤系統</title>
    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                const swCode = "self.addEventListener('install', e => e.waitUntil(self.skipWaiting())); self.addEventListener('activate', e => e.waitUntil(self.clients.claim())); self.addEventListener('fetch', e => { e.respondWith(fetch(e.request).catch(() => new Response('Offline'))); });";
                const blob = new Blob([swCode], { type: 'application/javascript' });
                navigator.serviceWorker.register(URL.createObjectURL(blob));
            });
        }
    </script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/lucide@latest"></script>
    <style>
        /* UI/UX Pro Max - Global Design Protocol */
        :root {
            --primary: #D35400;
            --secondary: #E67E22;
            --surface: #FDF2E9;
            --text-main: #333333;
        }
        body {
            line-height: 1.5;
            background-color: var(--surface);
            color: var(--text-main);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            overscroll-behavior-y: none;
        }
        
        .btn-primary-action {
            background-color: var(--primary);
            color: white;
            transition: all 0.2s ease-in-out;
        }
        .btn-primary-action:hover { background-color: var(--secondary); }
        .btn-primary-action:active { transform: scale(0.96); }
        .btn-primary-action:disabled { background-color: #D1D5DB; cursor: not-allowed; transform: none; }

        .btn-outline-action {
            color: var(--primary);
            border: 1px solid var(--primary);
            transition: all 0.2s;
        }
        .btn-outline-action:hover { background-color: var(--surface); }
        .btn-outline-action:active { transform: scale(0.96); }

        .input-error-state { border: 2px solid #EF4444 !important; }
        .error-hint { color: #EF4444; font-size: 0.875rem; margin-top: 4px; }

        .card-data-container {
            background-color: #FFFFFF;
            border-radius: 12px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.05);
            padding: 24px;
        }

        .sidebar-item-active { background-color: var(--primary); color: white; border-radius: 8px; }
        .sidebar-item { color: #9CA3AF; transition: all 0.2s; border-radius: 8px; }
        .sidebar-item:hover { background-color: rgba(211, 84, 0, 0.1); color: var(--primary); }

        .loader {
            border: 3px solid #f3f3f3;
            border-top: 3px solid var(--primary);
            border-radius: 50%;
            width: 16px;
            height: 16px;
            animation: spin 1s linear infinite;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        .fade-in { animation: fadeIn 0.3s ease-in; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useMemo, useRef } = React;
        const STORAGE_KEY = 'HR_APP_DATA_V10_FUSION';

        const LockScreen = ({ onUnlock, error, passcodeLength = 6 }) => {
            const [passcode, setPasscode] = useState('');
            const handleChange = (e) => setPasscode(e.target.value.replace(/[^0-9]/g, ''));
            const handleSubmit = (e) => { e.preventDefault(); onUnlock(passcode); };

            return (
                <div className="fixed inset-0 z-[200] bg-slate-900 flex flex-col items-center justify-center px-6">
                    <div className="bg-white p-8 rounded-3xl shadow-2xl w-full max-w-xs text-center relative overflow-hidden fade-in">
                        <div className="absolute top-0 left-0 w-full h-2 bg-[var(--primary)]"></div>
                        <div className="flex justify-center mb-4 text-[var(--primary)]"><i data-lucide="lock" className="w-12 h-12"></i></div>
                        <h2 className="text-xl font-black text-gray-800 mb-2">系統已鎖定</h2>
                        <p className="text-xs text-gray-500 font-bold mb-6">預設密碼為 123456</p>
                        <form onSubmit={handleSubmit}>
                            <input type="password" value={passcode} onChange={handleChange} maxLength={passcodeLength} placeholder="******"
                                className={`w-full text-center text-2xl tracking-[0.5em] font-black border-2 rounded-xl py-3 focus:outline-none transition-all ${error ? 'input-error-state bg-red-50' : 'border-gray-200 focus:border-[var(--primary)]'}`} />
                            {error && <p className="error-hint animate-pulse mt-2">{error}</p>}
                            <button type="submit" className="mt-6 w-full btn-primary-action py-3 rounded-xl font-bold flex items-center justify-center gap-2">
                                <i data-lucide="key" className="w-4 h-4"></i> 解鎖進入
                            </button>
                        </form>
                    </div>
                </div>
            );
        };

        const StatCard = ({ icon, title, value, subtext, highlight, bgColor, iconColor }) => (
            <div className="card-data-container flex items-center gap-6">
                <div className={`w-16 h-16 rounded-full flex items-center justify-center ${bgColor} ${iconColor}`}>
                    <i data-lucide={icon} className="w-8 h-8"></i>
                </div>
                <div>
                    <div className="text-gray-500 text-sm font-medium mb-1">{title}</div>
                    <div className="text-3xl font-bold text-gray-800 mb-1">{value}</div>
                    <div className="text-sm text-gray-400 flex items-center gap-1">
                        {subtext} {highlight && <span className={highlight.includes('↑') ? "text-green-500" : ""}>{highlight}</span>}
                    </div>
                </div>
            </div>
        );

        const App = () => {
            const [isLocked, setIsLocked] = useState(true);
            const [lockError, setLockError] = useState('');
            const [currentView, setCurrentView] = useState('dashboard');
            const [isLoading, setIsLoading] = useState(false);
            const [isAmountMasked, setIsAmountMasked] = useState(false);
            const [targetMonth, setTargetMonth] = useState(new Date().toISOString().slice(0, 7));
            
            const [leaveForm, setLeaveForm] = useState({ date: new Date().toISOString().split('T')[0], type: 'annual', hours: 8 });
            const [showBrackets, setShowBrackets] = useState(false);
            const pressTimer = useRef(null);

            const handlePressStart = () => { pressTimer.current = setTimeout(() => setShowBrackets(true), 800); };
            const handlePressEnd = () => { if (pressTimer.current) clearTimeout(pressTimer.current); setShowBrackets(false); };
            
            const [data, setData] = useState(() => {
                const saved = localStorage.getItem(STORAGE_KEY);
                return saved ? JSON.parse(saved) : {
                    passcode: '123456',
                    gasUrl: '',
                    monthlySalaries: {},
                    dependentsCount: 0,
                    employmentStartDate: '2023-08-07',
                    historicalLeave: { annual: 0, sick: 0, personal: 0 },
                    records: [],
                    holidays: {}
                };
            })

            useEffect(() => {
                if (window.lucide) window.lucide.createIcons();
            });

            useEffect(() => {
                localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
            }, [data]);

            const syncToCloud = async (newData, showLoading = false) => {
                setData(newData); 
                if (!newData.gasUrl) return; 
                if (showLoading) setIsLoading(true);
                try {
                    await fetch(newData.gasUrl, { method: 'POST', body: JSON.stringify(newData) });
                } catch (err) { console.error('雲端儲存失敗', err); }
                if (showLoading) setIsLoading(false);
            };

            const fetchFromCloud = async () => {
                if (!data.gasUrl) return alert('請先至「員工管理」設定 GAS 雲端網址');
                setIsLoading(true);
                try {
                    const res = await fetch(data.gasUrl);
                    const cloudData = await res.json();
                    if (Object.keys(cloudData).length > 0) {
                        setData(cloudData);
                        alert('成功從雲端同步資料！');
                    }
                } catch (err) { alert('讀取失敗，請確認 GAS 網址與網路連線。'); }
                setIsLoading(false);
            };

            // 自動補卡邏輯回溯至 4月
            useEffect(() => {
                if (isLocked) return;
                
                const now = new Date();
                const year = now.getFullYear();
                const startDate = new Date(year, 3, 1); 
                let hasChanges = false;
                let newRecords = [...data.records];

                for (let d = new Date(startDate); d <= now; d.setDate(d.getDate() + 1)) {
                    const y = d.getFullYear();
                    const m = d.getMonth();
                    const day = d.getDate();
                    const dayOfWeek = d.getDay();
                    const dateStr = `${y}-${String(m + 1).padStart(2, '0')}-${String(day).padStart(2, '0')}`;
                    
                    let shouldWork = (dayOfWeek >= 1 && dayOfWeek <= 5);
                    if (data.holidays && data.holidays[dateStr] !== undefined) {
                        shouldWork = !data.holidays[dateStr]; 
                    }
                    
                    if (shouldWork) { 
                        const hasPunchIn = newRecords.some(r => r.date === dateStr && r.type === 'punch_in');
                        const hasPunchOut = newRecords.some(r => r.date === dateStr && r.type === 'punch_out');

                        const punchInLimit = new Date(y, m, day, 8, 59).getTime();
                        if (!hasPunchIn && now.getTime() > punchInLimit) {
                            const min = 55 + Math.floor(Math.random() * 5); 
                            newRecords.push({ id: Date.now() + Math.random(), date: dateStr, type: 'punch_in', time: `08:${min}`, hours: 0, amount: 0 });
                            hasChanges = true;
                        }

                        const otRecord = newRecords.find(r => r.date === dateStr && r.type === 'overtime');

                        if (!hasPunchOut) {
                            if (otRecord) {
                                const targetHour = 18 + Math.floor(otRecord.hours);
                                const targetMin = (otRecord.hours % 1) * 60;
                                const otPunchOutLimit = new Date(y, m, day, targetHour, targetMin + 3).getTime();
                                
                                if (now.getTime() > otPunchOutLimit) {
                                    let finalMin = targetMin + 1 + Math.floor(Math.random() * 3);
                                    let finalHour = targetHour;
                                    if (finalMin >= 60) { finalHour += 1; finalMin -= 60; }
                                    const timeStr = `${String(finalHour).padStart(2, '0')}:${String(finalMin).padStart(2, '0')}`;
                                    newRecords.push({ id: Date.now() + Math.random(), date: dateStr, type: 'punch_out', time: timeStr, hours: 0, amount: 0 });
                                    hasChanges = true;
                                }
                            } else {
                                const defaultCutoffTime = new Date(y, m, day, 18, 5).getTime();
                                if (now.getTime() > defaultCutoffTime) {
                                    const min = 1 + Math.floor(Math.random() * 3); 
                                    newRecords.push({ id: Date.now() + Math.random(), date: dateStr, type: 'punch_out', time: `18:0${min}`, hours: 0, amount: 0 });
                                    hasChanges = true;
                                }
                            }
                        }
                    }
                }

                if (hasChanges) {
                    syncToCloud({ ...data, records: newRecords }, false);
                }
            }, [isLocked, data]);

            const handleManualPunch = (type) => {
                const now = new Date();
                const date = now.toISOString().split('T')[0];
                const time = now.toTimeString().slice(0, 5);
                
                if (data.records.some(r => r.date === date && r.type === type)) {
                    alert(type === 'punch_in' ? '今日已打過上班卡！' : '今日已打過下班卡！');
                    return;
                }
                syncToCloud({ ...data, records: [{ id: Date.now(), date, type, time, hours: 0, amount: 0 }, ...data.records] }, true);
                alert(`${type === 'punch_in' ? '上班' : '下班'}打卡成功！時間：${time}`);
            };

            const handleUnlock = (input) => {
                if (input === data.passcode) { setIsLocked(false); setLockError(''); } 
                else { setLockError('密碼錯誤，請重新輸入'); }
            };

            const currentSalary = useMemo(() => {
                if (data.monthlySalaries[targetMonth]) return data.monthlySalaries[targetMonth];
                const past = Object.keys(data.monthlySalaries).filter(m => m < targetMonth).sort().reverse();
                return past.length > 0 ? data.monthlySalaries[past[0]] : 29500;
            }, [data.monthlySalaries, targetMonth]);

            const exactHourlyWage = useMemo(() => Math.round((currentSalary || 0) / 240), [currentSalary]);

            const laborBracket = useMemo(() => {
                const brackets = [29500, 30300, 31800, 33300, 34800, 36300, 38200, 40100, 42000, 43900, 45800];
                return brackets.find(x => currentSalary <= x) || brackets[brackets.length - 1] || 0;
            }, [currentSalary]);

            const laborFee = useMemo(() => {
                return Math.round(laborBracket * 0.125 * 0.2);
            }, [laborBracket]);

            const healthBracket = useMemo(() => {
                const brackets = [29500, 30300, 31800, 33300, 34800, 36300, 38200, 40100, 42000, 43900, 45800, 48200, 50600, 53000, 55400, 57800, 60800, 63800, 66800, 69800, 72800, 76500, 80200, 83900, 87600, 92100, 96600, 101100, 105600, 110100, 115500, 120900, 126300, 131700, 137100, 142500, 147900, 219500];
                return brackets.find(x => currentSalary <= x) || brackets[brackets.length - 1] || 0;
            }, [currentSalary]);

            const healthFee = useMemo(() => {
                return Math.round(healthBracket * 0.0517 * 0.3) * (1 + (data.dependentsCount || 0));
            }, [healthBracket, data.dependentsCount]);

            const annualLeaveTotalHours = useMemo(() => {
                if (!data.employmentStartDate) return 0;
                const diffYears = (new Date() - new Date(data.employmentStartDate)) / (1000 * 60 * 60 * 24 * 365.25);
                let days = 0;
                if (diffYears >= 0.5 && diffYears < 1) days = 3;
                else if (diffYears >= 1 && diffYears < 2) days = 7;
                else if (diffYears >= 2 && diffYears < 3) days = 10;
                else if (diffYears >= 3 && diffYears < 5) days = 14;
                else if (diffYears >= 5 && diffYears < 10) days = 15;
                else if (diffYears >= 10) days = Math.min(30, 15 + Math.floor(diffYears) - 9);
                return days * 8;
            }, [data.employmentStartDate]);

            const leaveUsed = useMemo(() => {
                const u = { annual: 0, sick: data.historicalLeave?.sick || 0, personal: data.historicalLeave?.personal || 0 };
                const now = new Date();
                const start = new Date(data.employmentStartDate || now);
                let baseDate = new Date(now.getFullYear(), start.getMonth(), start.getDate());
                if (baseDate > now) baseDate.setFullYear(baseDate.getFullYear() - 1);

                data.records.forEach(r => {
                    const recDate = new Date(r.date);
                    if (r.type === 'annual') {
                        if (recDate >= baseDate) u.annual += r.hours;
                    } else if (u[r.type] !== undefined) {
                        u[r.type] += r.hours;
                    }
                });
                u.annual += data.historicalLeave?.annual || 0;
                return u;
            }, [data.records, data.historicalLeave, data.employmentStartDate]);

            const leaveLimits = { annual: annualLeaveTotalHours, sick: 240, personal: 112 };
            const formatDaysHours = (h) => h % 8 === 0 ? `${h / 8}天` : `${Math.floor(h / 8)}天${h % 8}h`;

            const monthlyRecords = data.records.filter(r => r.date.startsWith(targetMonth)).sort((a,b) => new Date(b.date) - new Date(a.date));
            const targetYear = targetMonth.split('-')[0];
            const yearlyRecords = data.records.filter(r => r.date.startsWith(targetYear)).sort((a,b) => new Date(b.date) - new Date(a.date));
            const actualWorkDays = new Set(monthlyRecords.filter(r => r.type === 'punch_in').map(r => r.date)).size;

            const otHours = monthlyRecords.filter(r => r.type === 'overtime').reduce((sum, r) => sum + r.hours, 0);
            const leaveHours = monthlyRecords.filter(r => ['annual','sick','personal'].includes(r.type)).reduce((sum, r) => sum + r.hours, 0);
            const totalMonthlyChanges = monthlyRecords.reduce((sum, r) => sum + r.amount, 0);
            const estimatedFinalSalary = (currentSalary || 0) + totalMonthlyChanges - laborFee - healthFee;

            const allLeaves = data.records.filter(r => ['annual', 'sick', 'personal'].includes(r.type)).sort((a,b) => new Date(b.date) - new Date(a.date)).slice(0, 5);
            let weekdaysInMonth = 0;
            const daysInMonth = new Date(targetYear, targetMonth.split('-')[1], 0).getDate();
            for(let i=1; i<=daysInMonth; i++) {
                const dateStr = `${targetYear}-${String(targetMonth.split('-')[1]).padStart(2, '0')}-${String(i).padStart(2, '0')}`;
                const d = new Date(targetYear, parseInt(targetMonth.split('-')[1])-1, i).getDay();
                let shouldWork = (d !== 0 && d !== 6);
                if (data.holidays && data.holidays[dateStr] !== undefined) {
                    shouldWork = !data.holidays[dateStr];
                }
                if (shouldWork) weekdaysInMonth++;
            }
            const leaveDaysThisMonth = new Set(monthlyRecords.filter(r => ['annual', 'sick', 'personal'].includes(r.type)).map(r => r.date)).size;
            const otDaysThisMonth = new Set(monthlyRecords.filter(r => r.type === 'overtime').map(r => r.date)).size;
            const missedDaysThisMonth = Math.max(0, weekdaysInMonth - actualWorkDays - leaveDaysThisMonth);

            const renderDashboard = () => (
                <div className="fade-in">
                    <div className="flex justify-between items-center mb-6">
                        <h2 className="text-xl font-bold text-gray-800">首頁總覽</h2>
                        <input type="month" value={targetMonth} onChange={(e) => setTargetMonth(e.target.value)} className="px-4 py-2 border rounded-lg font-bold text-gray-700 outline-none focus:border-[var(--primary)]" />
                    </div>
                    <div className="grid grid-cols-1 lg:grid-cols-3 gap-4 lg:gap-6 mb-6">
                        <StatCard icon="calendar-check" title="本月出勤天數" value={`${actualWorkDays} 天`} subtext="基於打卡紀錄" bgColor="bg-blue-50" iconColor="text-blue-500" />
                        <StatCard icon="clock" title="本月加班時數" value={otHours} highlight="小時" bgColor="bg-green-50" iconColor="text-green-500" />
                        <StatCard icon="plane" title="本月請假時數" value={leaveHours} highlight="小時" bgColor="bg-orange-50" iconColor="text-orange-500" />
                    </div>
                    <div className="grid grid-cols-1 lg:grid-cols-3 gap-4 lg:gap-6 mb-6">
                        <div className="card-data-container lg:col-span-2 overflow-x-auto">
                            <div className="flex justify-between items-center mb-6">
                                <h2 className="text-lg font-bold text-gray-800">本年度出勤與變動</h2>
                                <button onClick={() => setCurrentView('records')} className="text-[var(--primary)] text-sm flex items-center hover:underline">查看完整紀錄 <i data-lucide="chevron-right" className="w-4 h-4"></i></button>
                            </div>
                            <table className="w-full text-center text-sm">
                                <thead>
                                    <tr className="text-gray-500 border-b border-gray-100">
                                        <th className="py-3 font-medium">日期</th>
                                        <th className="py-3 font-medium">類別</th>
                                        <th className="py-3 font-medium">時數/時間</th>
                                        <th className="py-3 font-medium">增減金額</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    {yearlyRecords.filter(r => ['annual', 'sick', 'personal'].includes(r.type)).slice(0, 5).map(r => (
                                        <tr key={r.id} className="border-b border-gray-50 hover:bg-[#FDF2E9] transition-colors">
                                            <td className="py-3">{r.date}</td>
                                            <td className="py-3 font-bold">
                                                {r.type === 'overtime' ? '加班' : r.type === 'sick' ? '病假' : r.type === 'personal' ? '事假' : r.type === 'annual' ? '特休' : r.type === 'punch_in' ? '上班打卡' : r.type === 'punch_out' ? '下班打卡' : '獎金'}
                                            </td>
                                            <td className="py-3">{r.time ? r.time : (r.hours > 0 ? `${r.hours} h` : '-')}</td>
                                            <td className={`py-3 font-bold ${r.amount > 0 ? 'text-emerald-500' : (r.amount < 0 ? 'text-red-500' : 'text-gray-400')}`}>{isAmountMasked ? '***' : r.amount}</td>
                                        </tr>
                                    ))}
                                    {yearlyRecords.length === 0 && <tr><td colSpan="4" className="py-6 text-gray-400">目前尚無紀錄</td></tr>}
                                </tbody>
                            </table>
                        </div>
                        <div className="card-data-container">
                            <div className="flex justify-between items-center mb-6">
                                <h2 className="text-lg font-bold text-gray-800">假別餘額 (時數)</h2>
                                <button onClick={() => setCurrentView('leave')} className="text-[var(--primary)] text-sm flex items-center hover:underline">管理 <i data-lucide="chevron-right" className="w-4 h-4"></i></button>
                            </div>
                            <div className="space-y-6">
                                {[ 
                                    { key: 'annual', name: '特休假', icon: 'star', color: 'bg-blue-500', iconBg: 'bg-blue-100 text-blue-500' },
                                    { key: 'sick', name: '病假', icon: 'thermometer', color: 'bg-green-500', iconBg: 'bg-green-100 text-green-500' },
                                    { key: 'personal', name: '事假', icon: 'clipboard-list', color: 'bg-orange-400', iconBg: 'bg-orange-100 text-orange-400' }
                                ].map(item => {
                                    const total = leaveLimits[item.key];
                                    const used = leaveUsed[item.key];
                                    const bal = Math.max(0, total - used);
                                    return (
                                        <div key={item.key}>
                                            <div className="flex justify-between items-center mb-2">
                                                <div className="flex items-center gap-3">
                                                    <div className={`w-8 h-8 rounded-lg flex items-center justify-center ${item.iconBg}`}><i data-lucide={item.icon} className="w-4 h-4"></i></div>
                                                    <span className="font-medium text-gray-700">{item.name}</span>
                                                </div>
                                                <div className="text-sm">
                                                    <span className="font-bold text-gray-800">{bal}</span> / <span className="text-gray-400">{total}</span>
                                                </div>
                                            </div>
                                            <div className="w-full bg-gray-100 h-2 rounded-full overflow-hidden">
                                                <div className={`h-full ${item.color} rounded-full`} style={{ width: `${total > 0 ? (used / total) * 100 : 0}%` }}></div>
                                            </div>
                                        </div>
                                    )
                                })}
                            </div>
                        </div>
                    </div>
                    
                    <div className="grid grid-cols-2 gap-6">
                        <div className="card-data-container">
                            <div className="flex justify-between items-center mb-6">
                                <h2 className="text-lg font-bold text-gray-800">近期請假申請</h2>
                                <button onClick={() => setCurrentView('records')} className="text-[var(--primary)] text-sm font-medium hover:underline">查看全部</button>
                            </div>
                            <div className="space-y-4 text-sm">
                                {allLeaves.length === 0 ? (
                                    <div className="text-gray-400 py-4 text-center">目前尚無請假紀錄</div>
                                ) : (
                                    allLeaves.map(r => {
                                        const d = new Date(r.date);
                                        const weekDays = ['日', '一', '二', '三', '四', '五', '六'];
                                        return (
                                            <div key={r.id} className="flex justify-between items-center pb-3 border-b border-gray-50">
                                                <span className="text-gray-500 w-32">{r.date.replace(/-/g, '/')} ({weekDays[d.getDay()]})</span>
                                                <span className="font-bold w-12 text-center">{r.type === 'sick' ? '病假' : r.type === 'personal' ? '事假' : '特休'}</span>
                                                <span className="font-bold w-16 text-right">{r.hours.toFixed(1)} 小時</span>
                                                <span className="ml-auto px-3 py-1 rounded-full border border-green-200 text-green-500 bg-green-50 text-xs">已登記</span>
                                            </div>
                                        );
                                    })
                                )}
                            </div>
                        </div>

                        <div className="card-data-container">
                            <h2 className="text-lg font-bold text-gray-800 mb-6">出勤狀態 (本月)</h2>
                            <div className="flex items-center justify-around">
                                <div className="relative w-36 h-36 rounded-full flex items-center justify-center" style={{
                                    background: `conic-gradient(#3B82F6 0% ${(actualWorkDays/weekdaysInMonth)*100}%, #F97316 ${(actualWorkDays/weekdaysInMonth)*100}% ${((actualWorkDays+leaveDaysThisMonth)/weekdaysInMonth)*100}%, #22C55E ${((actualWorkDays+leaveDaysThisMonth)/weekdaysInMonth)*100}% ${((actualWorkDays+leaveDaysThisMonth+otDaysThisMonth)/weekdaysInMonth)*100}%, #9CA3AF ${((actualWorkDays+leaveDaysThisMonth+otDaysThisMonth)/weekdaysInMonth)*100}% 100%)`
                                }}>
                                    <div className="w-28 h-28 bg-white rounded-full flex flex-col items-center justify-center">
                                        <span className="text-xs text-gray-500 mb-1">應出勤</span>
                                        <span className="text-xl font-bold text-gray-800">{weekdaysInMonth} 天</span>
                                    </div>
                                </div>
                                <div className="space-y-4 text-sm">
                                    <div className="flex items-center gap-6">
                                        <div className="flex items-center gap-2 w-16"><div className="w-3 h-3 rounded-full bg-blue-500"></div><span className="text-gray-700">出勤</span></div>
                                        <span className="text-gray-600 font-medium">{actualWorkDays} 天 ({Math.round((actualWorkDays/weekdaysInMonth)*100 || 0)}%)</span>
                                    </div>
                                    <div className="flex items-center gap-6">
                                        <div className="flex items-center gap-2 w-16"><div className="w-3 h-3 rounded-full bg-orange-500"></div><span className="text-gray-700">請假</span></div>
                                        <span className="text-gray-600 font-medium">{leaveDaysThisMonth} 天 ({Math.round((leaveDaysThisMonth/weekdaysInMonth)*100 || 0)}%)</span>
                                    </div>
                                    <div className="flex items-center gap-6">
                                        <div className="flex items-center gap-2 w-16"><div className="w-3 h-3 rounded-full bg-green-500"></div><span className="text-gray-700">加班</span></div>
                                        <span className="text-gray-600 font-medium">{otDaysThisMonth} 天 ({Math.round((otDaysThisMonth/weekdaysInMonth)*100 || 0)}%)</span>
                                    </div>
                                    <div className="flex items-center gap-6">
                                        <div className="flex items-center gap-2 w-16"><div className="w-3 h-3 rounded-full bg-gray-400"></div><span className="text-gray-700">未打卡</span></div>
                                        <span className="text-gray-600 font-medium">{missedDaysThisMonth} 天 ({Math.round((missedDaysThisMonth/weekdaysInMonth)*100 || 0)}%)</span>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            );

            const [attForm, setAttForm] = useState({ date: new Date().toISOString().split('T')[0], type: 'overtime', hours: 1 });
            const [bonusForm, setBonusForm] = useState({ date: new Date().toISOString().split('T')[0], type: 'bonus_festival', amount: '' });
            const [editState, setEditState] = useState(null); // 紀錄編輯狀態
            
            const handleAddAttendance = (e) => {
                e.preventDefault();
                let amt = 0;
                if (attForm.type === 'overtime') {
                    const r1 = 4 / 3, r2 = 5 / 3;
                    amt = attForm.hours <= 2 ? Math.round(exactHourlyWage * r1 * attForm.hours) : Math.round((exactHourlyWage * r1 * 2) + (exactHourlyWage * r2 * (attForm.hours - 2)));
                }
                
                let newRecords = [{ id: Date.now(), date: attForm.date, type: attForm.type, hours: attForm.hours, amount: amt }, ...data.records];
                
                if (attForm.type === 'overtime') {
                    const punchOutIndex = newRecords.findIndex(r => r.date === attForm.date && r.type === 'punch_out');
                    const targetHour = 18 + Math.floor(attForm.hours);
                    const targetMin = (attForm.hours % 1) * 60;
                    let finalMin = targetMin + 1 + Math.floor(Math.random() * 3);
                    let finalHour = targetHour;
                    if (finalMin >= 60) { finalHour += 1; finalMin -= 60; }
                    const timeStr = `${String(finalHour).padStart(2, '0')}:${String(finalMin).padStart(2, '0')}`;
                    
                    if (punchOutIndex !== -1) {
                        newRecords[punchOutIndex] = { ...newRecords[punchOutIndex], time: timeStr };
                    } else {
                        newRecords.push({ id: Date.now() + 1, date: attForm.date, type: 'punch_out', time: timeStr, hours: 0, amount: 0 });
                    }
                }
                syncToCloud({ ...data, records: newRecords }, true);
                alert('申報成功！');
            };

            const handleAddBonus = (e) => {
                e.preventDefault();
                if (!bonusForm.amount || bonusForm.amount <= 0) return alert('請輸入有效金額');
                syncToCloud({ ...data, records: [{ id: Date.now(), date: bonusForm.date, type: bonusForm.type, hours: 0, amount: Number(bonusForm.amount) }, ...data.records] }, true);
                setBonusForm({...bonusForm, amount: ''});
                alert('獎金新增成功！');
            };

            const handleAddLeave = (e) => {
                e.preventDefault();
                let amt = 0;
                if (leaveForm.type === 'personal') amt = -Math.round(exactHourlyWage * leaveForm.hours);
                if (leaveForm.type === 'sick') amt = -Math.round((exactHourlyWage / 2) * leaveForm.hours);
                syncToCloud({ ...data, records: [{ id: Date.now(), date: leaveForm.date, type: leaveForm.type, hours: leaveForm.hours, amount: amt }, ...data.records] }, true);
                alert('請假申報成功！');
            };

            const renderForms = () => (
                <div className="fade-in max-w-4xl mx-auto space-y-6">
                    <h2 className="text-xl font-bold text-gray-800 mb-6">出勤打卡與申報</h2>
                    
                    <div className="card-data-container border-l-4 border-blue-500 mb-6 flex justify-between items-center bg-blue-50/30">
                        <div>
                            <h3 className="text-lg font-bold text-gray-800 flex items-center gap-2"><i data-lucide="clock" className="text-blue-500"></i> 每日出勤打卡</h3>
                            <p className="text-xs text-gray-500 mt-1">若未手動打卡，系統將於規定時段自動推算並產生紀錄。</p>
                        </div>
                        <div className="flex gap-4">
                            <button onClick={() => handleManualPunch('punch_in')} className="bg-blue-600 hover:bg-blue-700 text-white font-bold py-2 px-6 rounded-lg transition-all shadow-sm">上班打卡</button>
                            <button onClick={() => handleManualPunch('punch_out')} className="bg-slate-600 hover:bg-slate-700 text-white font-bold py-2 px-6 rounded-lg transition-all shadow-sm">下班打卡</button>
                        </div>
                    </div>

                    <div className="card-data-container border-l-4 border-emerald-500">
                        <h3 className="text-lg font-bold text-gray-800 mb-4 flex items-center gap-2"><i data-lucide="calendar-check" className="text-emerald-500"></i> 出勤異動申報</h3>
                        <form onSubmit={handleAddAttendance} className="grid grid-cols-1 lg:grid-cols-4 gap-4 items-end">
                            <div>
                                <label className="block text-xs font-bold text-gray-500 mb-1">日期</label>
                                <input type="date" required value={attForm.date} onChange={e => setAttForm({...attForm, date: e.target.value})} className="w-full px-3 py-2 border rounded-lg font-bold" />
                            </div>
                            <div>
                                <label className="block text-xs font-bold text-gray-500 mb-1">類別</label>
                                <select value={attForm.type} onChange={e => setAttForm({...attForm, type: e.target.value})} className="w-full px-3 py-2 border rounded-lg font-bold">
                                    <option value="overtime">平日加班</option>
                                </select>
                            </div>
                            <div>
                                <label className="block text-xs font-bold text-gray-500 mb-1">時數</label>
                                <input type="number" step="0.5" required min="0.5" value={attForm.hours} onChange={e => setAttForm({...attForm, hours: Number(e.target.value)})} className="w-full px-3 py-2 border rounded-lg font-bold" />
                            </div>
                            <button type="submit" className="bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-2 rounded-lg transition-all shadow-sm">申報送出</button>
                        </form>
                    </div>

                    <div className="card-data-container border-l-4 border-yellow-500">
                        <h3 className="text-lg font-bold text-gray-800 mb-4 flex items-center gap-2"><i data-lucide="sack-dollar" className="text-yellow-500"></i> 額外獎金收入申報</h3>
                        <form onSubmit={handleAddBonus} className="grid grid-cols-1 lg:grid-cols-4 gap-4 items-end">
                            <div>
                                <label className="block text-xs font-bold text-gray-500 mb-1">發放日期</label>
                                <input type="date" required value={bonusForm.date} onChange={e => setBonusForm({...bonusForm, date: e.target.value})} className="w-full px-3 py-2 border rounded-lg font-bold" />
                            </div>
                            <div>
                                <label className="block text-xs font-bold text-gray-500 mb-1">獎金名目</label>
                                <select value={bonusForm.type} onChange={e => setBonusForm({...bonusForm, type: e.target.value})} className="w-full px-3 py-2 border rounded-lg font-bold">
                                    <option value="bonus_festival">三節獎金</option>
                                    <option value="bonus_incentive">激勵獎金</option>
                                    <option value="bonus_yearend">年終獎金</option>
                                    <option value="bonus_birthday">生日禮金</option>
                                </select>
                            </div>
                            <div>
                                <label className="block text-xs font-bold text-gray-500 mb-1">金額 (NT$)</label>
                                <input type="number" required min="1" value={bonusForm.amount} onChange={e => setBonusForm({...bonusForm, amount: e.target.value})} className="w-full px-3 py-2 border rounded-lg font-bold" />
                            </div>
                            <button type="submit" className="bg-yellow-500 hover:bg-yellow-600 text-white font-bold py-2 rounded-lg transition-all shadow-sm">新增獎金</button>
                        </form>
                    </div>
                </div>
            );

            const renderRecords = () => (
                <div className="fade-in card-data-container">
                    <div className="flex justify-between items-center mb-6">
                        <h2 className="text-xl font-bold text-gray-800">出勤紀錄與異動明細</h2>
                        <input type="month" value={targetMonth} onChange={(e) => setTargetMonth(e.target.value)} className="px-4 py-2 border rounded-lg font-bold text-gray-700 outline-none focus:border-[var(--primary)]" />
                    </div>
                    <table className="w-full text-center text-sm">
                        <thead className="bg-slate-50">
                            <tr className="text-gray-500 border-b border-gray-200">
                                <th className="py-3 font-medium">日期</th>
                                <th className="py-3 font-medium">類別</th>
                                <th className="py-3 font-medium">時數/時間</th>
                                <th className="py-3 font-medium">增減金額</th>
                                <th className="py-3 font-medium">操作</th>
                            </tr>
                        </thead>
                        <tbody>
                            {monthlyRecords.length === 0 ? (
                                <tr><td colSpan="5" className="py-12 text-gray-400 font-bold">本月無紀錄</td></tr>
                            ) : (
                                monthlyRecords.map(r => editState?.id === r.id ? (
                                    <tr key={r.id} className="border-b border-gray-100 bg-blue-50/50">
                                        <td className="py-2"><input type="date" value={editState.date} onChange={e=>setEditState({...editState, date: e.target.value})} className="border p-1 rounded w-full text-xs" /></td>
                                        <td className="py-2">
                                            <select value={editState.type} onChange={e=>setEditState({...editState, type: e.target.value})} className="border p-1 rounded w-full text-xs">
                                                <option value="punch_in">上班打卡</option>
                                                <option value="punch_out">下班打卡</option>
                                                <option value="overtime">加班</option>
                                                <option value="annual">特休</option>
                                                <option value="sick">病假</option>
                                                <option value="personal">事假</option>
                                                <option value="bonus_festival">三節獎金</option>
                                                <option value="bonus_incentive">激勵獎金</option>
                                                <option value="bonus_yearend">年終獎金</option>
                                                <option value="bonus_birthday">生日禮金</option>
                                            </select>
                                        </td>
                                        <td className="py-2">
                                            {['punch_in', 'punch_out'].includes(editState.type) ? 
                                                <input type="time" value={editState.time || ''} onChange={e=>setEditState({...editState, time: e.target.value, hours: 0})} className="border p-1 rounded w-full text-xs" /> :
                                                <input type="number" step="0.5" value={editState.hours || 0} onChange={e=>setEditState({...editState, hours: Number(e.target.value), time: null})} className="border p-1 rounded w-full text-xs" />
                                            }
                                        </td>
                                        <td className="py-2"><input type="number" value={editState.amount || 0} onChange={e=>setEditState({...editState, amount: Number(e.target.value)})} className="border p-1 rounded w-full text-xs" /></td>
                                        <td className="py-2 flex justify-center gap-2">
                                            <button onClick={() => {
                                                let newRecords = data.records.map(x => x.id === editState.id ? editState : x);
                                                syncToCloud({ ...data, records: newRecords }, true);
                                                setEditState(null);
                                            }} className="text-green-600 hover:text-green-800 p-2 bg-green-100 rounded-full transition-colors" title="儲存"><i data-lucide="check" className="w-4 h-4"></i></button>
                                            <button onClick={() => setEditState(null)} className="text-gray-500 hover:text-gray-700 p-2 bg-gray-100 rounded-full transition-colors" title="取消"><i data-lucide="x" className="w-4 h-4"></i></button>
                                        </td>
                                    </tr>
                                ) : (
                                    <tr key={r.id} className="border-b border-gray-100 hover:bg-[#FDF2E9] transition-colors">
                                        <td className="py-4">{r.date}</td>
                                        <td className={`py-4 font-bold ${r.type === 'annual' ? 'text-blue-500' : r.type === 'sick' ? 'text-green-500' : r.type === 'personal' ? 'text-orange-400' : ''}`}>
                                            {r.type.includes('bonus') ? '獎金' : (r.type === 'overtime' ? '加班' : (r.type === 'sick' ? '病假' : (r.type === 'personal' ? '事假' : (r.type === 'punch_in' ? '上班打卡' : (r.type === 'punch_out' ? '下班打卡' : '特休')))))}
                                        </td>
                                        <td className="py-4 font-bold">{r.time ? r.time : (r.hours > 0 ? `${r.hours} h` : '-')}</td>
                                        <td className={`py-4 font-bold ${r.amount > 0 ? 'text-emerald-500' : (r.amount < 0 ? 'text-red-500' : 'text-gray-400')}`}>{isAmountMasked ? '***' : r.amount}</td>
                                        <td className="py-4 flex justify-center gap-2">
                                            <button onClick={() => setEditState({...r})} className="text-blue-400 hover:text-blue-600 transition-colors p-2 bg-blue-50 rounded-full hover:bg-blue-100">
                                                <i data-lucide="edit-2" className="w-4 h-4"></i>
                                            </button>
                                            <button onClick={() => { 
                                                if(window.confirm('確定刪除此紀錄？')) {
                                                    let newRecords = data.records.filter(x => x.id !== r.id);
                                                    if (r.type === 'overtime') {
                                                        const punchOutIndex = newRecords.findIndex(x => x.date === r.date && x.type === 'punch_out');
                                                        if (punchOutIndex !== -1) {
                                                            const min = 0 + Math.floor(Math.random() * 4);
                                                            newRecords[punchOutIndex] = { ...newRecords[punchOutIndex], time: `18:0${min}` };
                                                        }
                                                    }
                                                    syncToCloud({ ...data, records: newRecords });
                                                }
                                            }} className="text-red-400 hover:text-red-600 transition-colors p-2 bg-red-50 rounded-full hover:bg-red-100">
                                                <i data-lucide="trash-2" className="w-4 h-4"></i>
                                            </button>
                                        </td>
                                    </tr>
                                ))
                            )}
                        </tbody>
                    </table>
                </div>
            );

            const renderLeave = () => (
                <div className="fade-in max-w-4xl mx-auto">
                    <h2 className="text-xl font-bold text-gray-800 mb-6">請假管理與假別設定</h2>
                    
                    <div className="card-data-container border-l-4 border-[#E67E22] mb-6">
                        <h3 className="text-lg font-bold text-gray-800 mb-4 flex items-center gap-2"><i data-lucide="plane" className="text-[#E67E22]"></i> 請假申報</h3>
                        <form onSubmit={handleAddLeave} className="grid grid-cols-1 lg:grid-cols-4 gap-4 items-end">
                            <div>
                                <label className="block text-xs font-bold text-gray-500 mb-1">發生日期</label>
                                <input type="date" required value={leaveForm.date} onChange={e => setLeaveForm({...leaveForm, date: e.target.value})} className="w-full px-3 py-2 border rounded-lg font-bold" />
                            </div>
                            <div>
                                <label className="block text-xs font-bold text-gray-500 mb-1">假別</label>
                                <select value={leaveForm.type} onChange={e => setLeaveForm({...leaveForm, type: e.target.value})} className="w-full px-3 py-2 border rounded-lg font-bold">
                                    <option value="annual">特休</option>
                                    <option value="sick">病假</option>
                                    <option value="personal">事假</option>
                                </select>
                            </div>
                            <div>
                                <label className="block text-xs font-bold text-gray-500 mb-1">時數</label>
                                <input type="number" step="0.5" required min="0.5" value={leaveForm.hours} onChange={e => setLeaveForm({...leaveForm, hours: Number(e.target.value)})} className="w-full px-3 py-2 border rounded-lg font-bold" />
                            </div>
                            <button type="submit" className="bg-[#D35400] hover:bg-[#E67E22] text-white font-bold py-2 rounded-lg transition-all shadow-sm">申報送出</button>
                        </form>
                    </div>

                    <div className="card-data-container mb-6">
                        <div className="flex justify-between items-center mb-6 border-b pb-4">
                            <h3 className="text-lg font-bold text-gray-800 flex items-center gap-2"><i data-lucide="calendar-range" className="text-amber-500"></i> 假別餘額管控</h3>
                            <button onClick={() => {
                                if(window.confirm('此動作將歸零「病假」與「事假」的期初時數，確定要重置嗎？')) {
                                    syncToCloud({...data, historicalLeave: {...data.historicalLeave, sick: 0, personal: 0}});
                                    alert('已重置');
                                }
                            }} className="btn-outline-action px-3 py-1 rounded text-xs font-bold">全部歸零</button>
                        </div>
                        <div className="grid grid-cols-3 gap-6">
                            {[ { key: 'annual', name: '特休', color: 'bg-blue-400' }, { key: 'sick', name: '病假', color: 'bg-amber-400' }, { key: 'personal', name: '事假', color: 'bg-red-400' } ].map(item => (
                                <div key={item.key} className="bg-slate-50 p-4 rounded-xl border relative overflow-hidden">
                                    <div className={`absolute left-0 top-0 w-1 h-full ${item.color}`}></div>
                                    <div className="text-xs font-black text-gray-400 mb-2 uppercase tracking-wide">{item.name}</div>
                                    <div className="text-2xl font-extrabold text-gray-800 leading-none mb-4">{formatDaysHours(Math.max(0, leaveLimits[item.key] - leaveUsed[item.key]))}</div>
                                    <div className="pt-3 border-t border-gray-200 flex justify-between items-center text-sm">
                                        <span className="text-gray-500 font-bold">期初已休(時)</span>
                                        <input type="number" className="w-16 text-center border rounded px-1 py-1 font-bold outline-none focus:border-[var(--primary)]"
                                            value={data.historicalLeave[item.key] || 0}
                                            onChange={e => syncToCloud({...data, historicalLeave: {...data.historicalLeave, [item.key]: Number(e.target.value)}})} />
                                    </div>
                                </div>
                            ))}
                        </div>
                    </div>
                </div>
            );

            const renderSalary = () => (
                <div className="fade-in max-w-3xl mx-auto space-y-6">
                    <h2 className="text-xl font-bold text-gray-800 mb-6">薪資結構查詢</h2>
                    <div className="bg-[var(--primary)] p-8 rounded-3xl text-white shadow-xl text-center relative overflow-hidden">
                        <div className="absolute -left-4 -bottom-4 opacity-10 text-8xl"><i data-lucide="wallet" className="w-48 h-48"></i></div>
                        <div className="text-sm opacity-80 mb-2 font-bold">{targetMonth.replace('-','年')}月 實發預估</div>
                        <div className="text-5xl font-black relative z-10 tracking-tight">NT$ {isAmountMasked ? '***,***' : estimatedFinalSalary.toLocaleString()}</div>
                        <div className="text-xs opacity-80 mt-4 bg-black/20 inline-block px-4 py-1.5 rounded-full relative z-10">底薪 + 加班與獎金 - 請假扣款 - 法定保險</div>
                    </div>
                    <div className="grid grid-cols-2 gap-6">
                        <div className="card-data-container">
                            <h3 className="text-sm font-bold text-gray-400 mb-4 border-b pb-2">本月變動明細</h3>
                            <div className="space-y-3 text-sm font-bold">
                                <div className="flex justify-between"><span className="text-gray-600">本月設定底薪</span><span>{isAmountMasked ? '***' : currentSalary.toLocaleString()}</span></div>
                                <div className="flex justify-between"><span className="text-gray-600">加給與獎金</span><span className="text-emerald-500">+{isAmountMasked ? '***' : monthlyRecords.filter(r => r.amount > 0).reduce((s,r)=>s+r.amount,0).toLocaleString()}</span></div>
                                <div className="flex justify-between"><span className="text-gray-600">請假扣款</span><span className="text-red-500">{isAmountMasked ? '***' : monthlyRecords.filter(r => r.amount < 0).reduce((s,r)=>s+r.amount,0).toLocaleString()}</span></div>
                            </div>
                        </div>
                        <div className="card-data-container relative select-none"
                             onMouseDown={handlePressStart} onMouseUp={handlePressEnd} onMouseLeave={handlePressEnd}
                             onTouchStart={handlePressStart} onTouchEnd={handlePressEnd}>
                            <h3 className="text-sm font-bold text-gray-400 mb-4 border-b pb-2">法定保險扣款 (自付額)</h3>
                            <div className="space-y-3 text-sm font-bold">
                                <div className="flex justify-between"><span>勞工保險</span><span className="text-amber-600">- NT$ {isAmountMasked ? '***' : laborFee.toLocaleString()}</span></div>
                                <div className="flex justify-between"><span>全民健保</span><span className="text-amber-600">- NT$ {isAmountMasked ? '***' : healthFee.toLocaleString()}</span></div>
                                <div className="pt-2 mt-2 border-t border-gray-100 text-xs text-gray-400 font-normal">依附人數：{data.dependentsCount} 人</div>
                            </div>
                            {showBrackets && (
                                <div className="absolute bottom-full left-0 mb-2 w-full bg-[#FDF2E9] border border-[#E67E22] shadow-xl rounded-xl p-4 z-50 text-xs text-gray-700 fade-in">
                                    <div className="font-bold mb-2 text-[#D35400]">目前適用之保險級距</div>
                                    <ul className="space-y-1 font-medium">
                                        <li>目前設定底薪：NT$ {isAmountMasked ? '***' : currentSalary.toLocaleString()}</li>
                                        <li className="text-[#D35400]">勞保投保級距：NT$ {isAmountMasked ? '***' : laborBracket.toLocaleString()}</li>
                                        <li className="text-[#D35400]">健保投保級距：NT$ {isAmountMasked ? '***' : healthBracket.toLocaleString()}</li>
                                    </ul>
                                </div>
                            )}
                        </div>
                    </div>
                </div>
            );

            const handleHolidayImport = (e) => {
                const file = e.target.files[0];
                if (!file) return;
                
                const keepOld = window.confirm('是否要保留系統中既有的行事曆資料？\n\n點擊「確定」：保留舊資料，並與新檔案合併\n點擊「取消」：清空舊資料，完全以這次匯入的檔案為主');
                
                const reader = new FileReader();
                reader.onload = (ev) => {
                    const text = ev.target.result;
                    let validCount = 0;
                    const newHolidays = keepOld ? { ...(data.holidays || {}) } : {};

                    try {
                        if (file.name.toLowerCase().endsWith('.csv')) {
                            const lines = text.split('\n').filter(line => line.trim().length > 0);
                            if (lines.length > 1) {
                                const headers = lines[0].split(',').map(h => h.trim().replace(/["\r]/g, '').toLowerCase());
                                const dateIdx = headers.findIndex(h => h === 'date' || h.includes('日期'));
                                const holidayIdx = headers.findIndex(h => h === 'isholiday' || h.includes('放假') || h === 'is_holiday');

                                if (dateIdx !== -1 && holidayIdx !== -1) {
                                    for (let i = 1; i < lines.length; i++) {
                                        const cols = lines[i].split(',');
                                        if (cols.length > Math.max(dateIdx, holidayIdx)) {
                                            const dateVal = cols[dateIdx].replace(/["\r]/g, '').trim();
                                            const isH = cols[holidayIdx].replace(/["\r]/g, '').trim();
                                            
                                            const rawDate = dateVal.replace(/[\/\-]/g, '');
                                            if (rawDate.length === 8 && !isNaN(rawDate)) {
                                                const y = rawDate.substring(0, 4);
                                                const m = rawDate.substring(4, 6);
                                                const d = rawDate.substring(6, 8);
                                                const isHolidayBool = (isH === '是' || String(isH).toLowerCase() === 'true' || isH === '1' || String(isH).toLowerCase() === 'y');
                                                newHolidays[`${y}-${m}-${d}`] = isHolidayBool;
                                                validCount++;
                                            }
                                        }
                                    }
                                }
                            }
                        } else {
                            const imported = JSON.parse(text);
                            imported.forEach(item => {
                                const dateKey = Object.keys(item).find(k => k.toLowerCase() === 'date' || k.includes('日期'));
                                const holidayKey = Object.keys(item).find(k => k.toLowerCase().includes('isholiday') || k.toLowerCase().includes('is_holiday') || k.includes('放假'));

                                if (dateKey && holidayKey) {
                                    const dateVal = item[dateKey];
                                    const isH = item[holidayKey];

                                    if (dateVal !== undefined && isH !== undefined && dateVal !== null) {
                                        const rawDate = String(dateVal).replace(/[\/\-]/g, '');
                                        if (rawDate.length === 8 && !isNaN(rawDate)) {
                                            const y = rawDate.substring(0, 4);
                                            const m = rawDate.substring(4, 6);
                                            const d = rawDate.substring(6, 8);
                                            const isHolidayBool = (isH === '是' || isH === true || String(isH).toLowerCase() === 'true' || isH === '1' || String(isH).toLowerCase() === 'y');
                                            newHolidays[`${y}-${m}-${d}`] = isHolidayBool;
                                            validCount++;
                                        }
                                    }
                                }
                            });
                        }

                        if (validCount === 0) {
                            alert('匯入警告：未能解析任何假日資料！請確認檔案為政府下載之 CSV 或 JSON，且包含「日期」與「是否放假」欄位。');
                            return;
                        }

                        syncToCloud({ ...data, holidays: newHolidays }, true);
                        alert(`年度行事曆載入成功！共匯入 ${validCount} 筆資料。`);
                    } catch (err) { 
                        alert('匯入失敗，請確認檔案格式是否正確。'); 
                        console.error(err);
                    }
                    e.target.value = ''; 
                };
                reader.readAsText(file, 'UTF-8');
            };

            const handleJSONImport = (e) => {
                const file = e.target.files[0];
                if (!file) return;
                const reader = new FileReader();
                reader.onload = (ev) => {
                    try {
                        const imported = JSON.parse(ev.target.result);
                        const mergedData = {
                            ...data,
                            passcode: imported.passcode || data.passcode,
                            gasUrl: imported.gasUrl || data.gasUrl,
                            monthlySalaries: imported.monthlySalaries || {},
                            dependentsCount: imported.dependentsCount || 0,
                            employmentStartDate: imported.employmentStartDate || '2023-08-07',
                            historicalLeave: imported.historicalLeave || { annual: 0, sick: 0, personal: 0 },
                            records: imported.records || [],
                            holidays: imported.holidays || data.holidays || {}
                        };
                        syncToCloud(mergedData, true);
                        alert('備份紀錄與設定已成功載入！');
                    } catch (err) { alert('匯入失敗，檔案格式錯誤。'); }
                    e.target.value = '';
                };
                reader.readAsText(file);
            };

            const renderEmployee = () => (
                <div className="fade-in max-w-3xl mx-auto space-y-6">
                    <h2 className="text-xl font-bold text-gray-800 mb-6">員工管理與系統設定</h2>
                    
                    <div className="card-data-container border-t-4 border-[var(--primary)]">
                        <h3 className="text-lg font-bold text-gray-800 mb-4">基本參數設定</h3>
                        <div className="grid grid-cols-2 gap-6">
                            <div>
                                <label className="block text-xs font-bold text-gray-500 mb-1">當月設定底薪 (NT$)</label>
                                <input type="number" value={currentSalary} onChange={e => syncToCloud({...data, monthlySalaries: {...data.monthlySalaries, [targetMonth]: Number(e.target.value)}})} className="w-full px-3 py-2 border rounded-lg font-bold focus:border-[var(--primary)] outline-none" />
                            </div>
                            <div>
                                <label className="block text-xs font-bold text-gray-500 mb-1">健保依附人數</label>
                                <select value={data.dependentsCount} onChange={e => syncToCloud({...data, dependentsCount: Number(e.target.value)})} className="w-full px-3 py-2 border rounded-lg font-bold bg-white focus:border-[var(--primary)] outline-none">
                                    <option value="0">僅保本人</option>
                                    <option value="1">1 位眷屬</option>
                                    <option value="2">2 位眷屬</option>
                                    <option value="3">3 位(含)以上</option>
                                </select>
                            </div>
                            <div className="col-span-2">
                                <label className="block text-xs font-bold text-gray-500 mb-1">到職日 (用於計算特休週年制)</label>
                                <input type="date" value={data.employmentStartDate} onChange={e => syncToCloud({...data, employmentStartDate: e.target.value})} className="w-full px-3 py-2 border rounded-lg font-bold focus:border-[var(--primary)] outline-none" />
                            </div>
                        </div>
                    </div>

                    <div className="card-data-container border-t-4 border-slate-700">
                        <h3 className="text-lg font-bold text-gray-800 mb-4 flex items-center gap-2"><i data-lucide="database" className="text-slate-600"></i> 資料轉移與雲端備份</h3>
                        <div className="space-y-4">
                            <div>
                                <label className="block text-xs font-bold text-gray-500 mb-1">GAS 雲端資料庫網址 (Web App URL)</label>
                                <input type="text" value={data.gasUrl} onChange={e => syncToCloud({...data, gasUrl: e.target.value})} placeholder="https://script.google.com/macros/s/..." className="w-full px-3 py-2 border rounded-lg font-bold focus:border-[var(--primary)] outline-none text-xs text-blue-600 bg-blue-50/50" />
                            </div>
                            <div className="flex gap-4 pt-2">
                                <div className="flex-1 relative">
                                    <input type="file" onChange={handleJSONImport} accept="application/json" className="absolute inset-0 opacity-0 cursor-pointer z-10" />
                                    <div className="h-full bg-emerald-50 border border-emerald-200 py-3 rounded-xl font-bold text-sm text-center text-emerald-700 shadow-sm flex items-center justify-center gap-2 pointer-events-none transition-all">
                                        <i data-lucide="upload-cloud"></i> 匯入備份 (支援新/舊版)
                                    </div>
                                </div>
                                <div className="flex-1 relative">
                                    <input type="file" onChange={handleHolidayImport} accept=".json,.csv,application/json,text/csv" className="absolute inset-0 opacity-0 cursor-pointer z-10" />
                                    <div className="h-full bg-orange-50 border border-orange-200 py-3 rounded-xl font-bold text-sm text-center text-orange-700 shadow-sm flex items-center justify-center gap-2 pointer-events-none transition-all">
                                        <i data-lucide="calendar"></i> 匯入年度行事曆
                                    </div>
                                </div>
                                <button onClick={() => {
                                    if(window.confirm('確定要清空系統內所有的行事曆資料嗎？\n出勤天數將恢復預設的週休二日計算。')) {
                                        syncToCloud({...data, holidays: {}});
                                        alert('已成功清空所有行事曆資料！請重新匯入正確的檔案。');
                                    }
                                }} className="flex-1 bg-red-50 border border-red-200 py-3 rounded-xl font-bold text-sm text-center text-red-700 shadow-sm flex items-center justify-center gap-2 hover:bg-red-100 transition-all">
                                    <i data-lucide="trash-2"></i> 清空行事曆
                                </button>
                                <button onClick={() => {
                                    const blob = new Blob([JSON.stringify(data, null, 2)], { type: "application/json" });
                                    const url = URL.createObjectURL(blob);
                                    const a = document.createElement('a'); a.href = url; a.download = `HR_Fusion_Backup_${new Date().toISOString().split('T')[0]}.json`;
                                    document.body.appendChild(a); a.click(); document.body.removeChild(a); URL.revokeObjectURL(url);
                                }} className="flex-1 bg-indigo-50 border border-indigo-200 py-3 rounded-xl font-bold text-sm text-center text-indigo-700 shadow-sm flex items-center justify-center gap-2 hover:bg-indigo-100 transition-all">
                                    <i data-lucide="download-cloud"></i> 下載本機存檔
                                </button>
                            </div>
                        </div>
                    </div>

                    <div className="card-data-container border-2 border-red-100">
                        <h3 className="text-lg font-bold text-red-600 mb-4 flex items-center gap-2"><i data-lucide="shield-alert" className="text-red-500"></i> 系統安全設定</h3>
                        <div>
                            <label className="block text-xs font-bold text-gray-500 mb-1">變更解鎖密碼 (6碼數字)</label>
                            <input type="password" maxLength={6} placeholder="輸入新密碼" onBlur={e => {
                                if(e.target.value.length === 6) { syncToCloud({...data, passcode: e.target.value}); alert('密碼更新成功'); e.target.value=''; }
                            }} className="w-full px-3 py-2 border rounded-lg font-bold tracking-widest text-center focus:border-red-400 outline-none" />
                        </div>
                    </div>
                </div>
            );

            if (isLocked) return <LockScreen onUnlock={handleUnlock} error={lockError} />;

            const navItems = [
                { id: 'dashboard', label: '首頁總覽', icon: 'layout-dashboard' },
                { id: 'clockin', label: '出勤打卡', icon: 'clock' },
                { id: 'records', label: '出勤紀錄', icon: 'file-text' },
                { id: 'leave', label: '請假管理', icon: 'plane' },
                { id: 'salary', label: '薪資查詢', icon: 'calculator' },
                { id: 'employee', label: '員工管理', icon: 'users' },
            ];

            return (
                <div className="flex min-h-screen pb-16 lg:pb-0">
                    {/* 電腦版左側選單：僅在大螢幕 (lg) 以上顯示 */}
                    <div className="hidden lg:flex w-64 bg-[#1E293B] h-screen flex-col justify-between fixed left-0 top-0 text-sm z-40">
                        <div>
                            <div className="flex items-center gap-3 p-6 text-white text-xl font-bold">
                                <div className="w-8 h-8 bg-white rounded-full flex items-center justify-center text-[#1E293B]">▲</div>
                                <div className="flex flex-col">
                                    <span>HR 出勤系統</span>
                                    <span className="text-[10px] text-gray-400 font-normal">v0.0.0.0.51 </span>
                                </div>
                            </div>
                            <nav className="px-4 space-y-2 mt-4">
                                {navItems.map(item => (
                                    <button key={item.id} onClick={() => setCurrentView(item.id)} className={`w-full flex items-center gap-3 px-4 py-3 ${currentView === item.id ? 'sidebar-item-active' : 'sidebar-item'}`}>
                                        <i data-lucide={item.icon} className="w-5 h-5"></i> {item.label}
                                    </button>
                                ))}
                            </nav>
                        </div>
                    </div>

                    {/* 手機/平板版底部導覽列：採用純 Icon 點擊設計 */}
                    <div className="lg:hidden fixed bottom-0 left-0 w-full bg-white border-t border-gray-200 flex justify-around items-center h-16 z-50 shadow-[0_-4px_10px_rgba(0,0,0,0.05)]">
                        {navItems.map(item => (
                            <button key={item.id} onClick={() => setCurrentView(item.id)} className={`flex flex-col items-center justify-center w-full h-full transition-colors ${currentView === item.id ? 'text-[var(--primary)]' : 'text-gray-400 hover:text-gray-600'}`} title={item.label}>
                                <div dangerouslySetInnerHTML={{ __html: `<i data-lucide="${item.icon}" class="w-6 h-6"></i>` }}></div>
                            </button>
                        ))}
                    </div>
                    
                    <div className="flex-1 flex flex-col lg:ml-64 bg-[var(--surface)] relative overflow-x-hidden">
                        <header className="h-16 lg:h-20 bg-white flex items-center justify-between px-4 lg:px-8 border-b border-gray-100 sticky top-0 z-10">
                            <div className="flex items-center gap-3 lg:gap-4">
                                <div className="flex flex-col">
                                    <h1 className="text-lg lg:text-xl font-semibold text-gray-800">{navItems.find(n => n.id === currentView)?.label}</h1>
                                    <span className="lg:hidden text-[10px] text-gray-400 font-normal mt-0.5">v0.0.0.0.2</span>
                                </div>
                                {isLoading && <div className="loader ml-2 lg:ml-4"></div>}
                            </div>
                            <div className="flex items-center gap-3 lg:gap-6">ountMasked)} className="text-gray-500 hover:text-[var(--primary)] transition-colors p-2" title="隱私遮蔽">
                                    <i data-lucide={isAmountMasked ? 'eye-off' : 'eye'} className="w-6 h-6 lg:w-5 lg:h-5"></i>
                                </button>
                                {/* 右上角雲端按鈕改為自動縮小為 Icon */}
                                <button onClick={fetchFromCloud} className="btn-outline-action w-10 h-10 lg:w-auto lg:px-4 lg:py-2 rounded-full lg:rounded-md text-xs flex items-center justify-center gap-2 font-bold" title="雲端同步">
                                    <i data-lucide="refresh-cw" className="w-5 h-5 lg:w-4 lg:h-4"></i>
                                    <span className="hidden lg:inline">雲端同步</span>
                                </button>
                            </div>
                        </header>
                        
                        <main className="p-4 lg:p-8 pb-8 lg:pb-12 flex-1 relative w-full">
                            {currentView === 'dashboard' && renderDashboard()}
                            {currentView === 'clockin' && renderForms()}
                            {currentView === 'records' && renderRecords()}
                            {currentView === 'leave' && renderLeave()}
                            {currentView === 'salary' && renderSalary()}
                            {currentView === 'employee' && renderEmployee()}
                        </main>
                    </div>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
